# Rebuilds posts.json (the list the site loads) and makes small copies of new photos whenever content changes.
name: Build entry index
on:
  push:
    branches: [main]
    paths: ["posts/**", "pages/**", "bestiary/**", "albums/**", "places/**", "photos/**", "scripts/**"]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-index.mjs
      - name: Make small copies of new photos
        run: bash scripts/make-thumbs.sh
      - name: Save the index and photo copies if they changed
        run: |
          git add posts.json thumbs large
          if ! git diff --cached --quiet; then
            git config user.name "half-life-index"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update entry index"
            git push
          fi
