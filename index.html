<!doctype html>
<html lang="en" class="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Half Life</title>
<meta name="description" content="Half Life: thoughts and photographs, kept while everything changes.">
<meta name="theme-color" content="#0a0612">
<meta property="og:title" content="Half Life">
<meta property="og:description" content="Thoughts and photographs, kept while everything changes.">
<meta property="og:image" content="https://halflife.studio/og.png?v=8">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+TC:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site/blog.css">
</head>
<body class="home">
<a class="skip" href="#main">Skip to the posts</a>
<!-- the tower: drawn by site/tower.js from the posts -->
<!-- the live purple light behind everything (blog.css, "aurora"); the tower is drawn over it -->
<div class="aurora-light" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="tower" aria-hidden="true"></canvas>

<aside class="side">
  <a class="mark" href="#/" aria-label="Half Life, home">
    <span class="mark-en">Half Life</span>
  </a>
  <button class="menutoggle" type="button" aria-expanded="false" aria-controls="menu">Menu</button>
  <nav class="menu" id="menu" aria-label="Sections">
    <div class="menuwin cmdwin">
      <p class="wintitle">Command</p>
      <ol class="cmds">
        <li><a href="#/posts" data-route="posts" data-say="Read what has been set down, most lately first."><span class="name">Posts</span><span class="count" id="postcount"></span></a></li>
        <li><a href="#/photos" data-route="photos" data-say="Look upon what the light allowed, before it thought better of it."><span class="name">Photos</span><span class="count" id="photocount"></span></a></li>
        <li><a href="#/about" data-route="about" data-say="Learn something of the person behind all this."><span class="name">About</span></a></li>
      </ol>
      <i class="pointer" aria-hidden="true"></i>
    </div>
    <div class="menuwin postwin">
      <p class="wintitle">Lately set down</p>
      <ol class="entries" id="entries"></ol>
      <i class="pointer" aria-hidden="true"></i>
    </div>
    <div class="menuwin saywin" aria-live="polite"><p id="say">Everything is already changing.</p></div>
    <div class="toggles"><button class="soundtoggle" type="button" id="music" aria-pressed="false">Music <span>off</span></button><button class="soundtoggle" type="button" id="sound" aria-pressed="true">Sound <span>on</span></button></div>
  </nav>
</aside>

<main id="main" tabindex="-1"><p class="loading">Winding the record&hellip;</p></main>

<!-- the readout in the corner, after the film's system monitor: filled in by site/blog.js -->
<aside class="readout" id="readout" aria-label="The record at a glance"></aside>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photograph">
  <button class="vclose" type="button" aria-label="Close">&times;</button>
  <button class="vprev" type="button" aria-label="Previous photograph">&lsaquo;</button>
  <figure><img alt=""><figcaption></figcaption></figure>
  <button class="vnext" type="button" aria-label="Next photograph">&rsaquo;</button>
</div>

<script src="/site/quotes.js" defer></script>
<script src="/site/tower.js" defer></script>
<script src="/site/blog.js" defer></script>
<script src="/site/music.js" defer></script>
</body>
</html>
