<style>
/* THE LOOK. Colours and fonts are set once near the top (the lines starting with --), then each part of
   the screen has its own block below, in roughly this order: windows and menu, bestiary, log list,
   pop-out window, entry text, photos, quest log, albums, map, animations, title screen, phone layout.
   The script further down explains how the page works.

   Layout: a 16-bit RPG menu screen. Title bar across the top, a large main window
   (log list / About / Help), a command window and a status window on the right.
   A title screen with a Start button covers it first; an opened entry pops out as a
   translucent window. The classic blue menu look: to change it, edit --win-a and --win-b just below. */
:root {
  color-scheme: dark;
  --win-a: #2a3da6;       /* window gradient, top: the classic menu blue */
  --win-b: #080d48;       /* window gradient, bottom */
  --accent: #ffffff;      /* cursor, headings */
  --bg: color-mix(in srgb, var(--win-b) 28%, #000);            /* field behind the windows */
  --veil: color-mix(in srgb, var(--bg) 62%, transparent);
  --border: #f6f2ff;                                            /* window frame */
  --border-shade: color-mix(in srgb, var(--win-a) 45%, #c4c4cc);/* inner frame line */
  --fg: #ffffff;
  --dim: color-mix(in srgb, var(--win-a) 22%, #fff);            /* dates, captions */
  --off: color-mix(in srgb, var(--win-a) 48%, #fff);            /* unavailable commands */
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --display: "Press Start 2P", "Courier New", monospace;
  --body: "DotGothic16", ui-monospace, Menlo, monospace;
  --read: "Newsreader", Georgia, "Times New Roman", serif;   /* long-form reading text */
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 17px; line-height: 1.7;
  padding-inline: 16px; padding-block: 20px 32px;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, .7);
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.stage {
  position: relative; z-index: 1;
  max-width: 960px; margin-inline: auto;
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr) 220px;
  grid-template-areas: "help help" "main menu" "main status" "main map";
  grid-template-rows: auto auto auto 1fr;
}
.win {
  background: linear-gradient(to bottom, var(--win-a), var(--win-b));
  border: 3px solid var(--border); border-radius: 9px;
  box-shadow: inset 0 0 0 2px var(--border-shade), 0 0 0 2px #000;
  padding: 14px 16px; min-width: 0;
}
#titlebar { grid-area: help; }
#titlebar .site { font-family: var(--display); font-size: 13px; line-height: 1.6; color: var(--accent); }
#main { grid-area: main; min-height: 440px; padding: 20px 20px 22px; }
#menu { grid-area: menu; display: flex; flex-direction: column; gap: 4px; }
#status { grid-area: status; align-self: start; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-variant-numeric: tabular-nums; }
#status dt { color: var(--dim); } #status dd { margin: 0; text-align: right; }
dl { margin: 0; }

h2, h3, .label { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; line-height: 1.6; }
h3 { font-size: 12px; line-height: 1.7; color: var(--accent); margin-top: 8px; }
.label { color: var(--accent); font-size: 12px; line-height: 1.6; letter-spacing: .06em; margin-bottom: 14px; }

/* a selectable option: the cursor appears on hover / focus, and the row leans out on a soft spring */
.opt {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 0 6px; align-items: baseline;
  width: 100%; padding: 6px 4px; text-align: left;
  background: none; border: 0; border-radius: 4px; color: inherit; font: inherit; text-shadow: inherit; cursor: pointer;
  transition: transform .5s var(--spring);
}
.opt::before {
  content: ""; width: 0; height: 0; align-self: center; visibility: hidden;
  border-left: 10px solid var(--accent); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  filter: drop-shadow(1px 1px 0 rgba(0, 0, 0, .7));
}
.opt:hover, .opt:focus-visible { transform: translateX(6px); }
.opt:active { transform: translateX(2px) scale(.97); transition-duration: .1s; }
.opt:hover::before, .opt:focus-visible::before, .opt[aria-current="true"]::before { visibility: visible; }
.opt:focus-visible { outline: none; }
.opt:focus-visible::before { animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(-4px); } }
.opt.locked { color: var(--off); cursor: default; pointer-events: none; }   /* greyed out: cannot be pointed at, selected or pressed */
.opt[aria-pressed="true"] { color: var(--accent); }
#menu .opt, .row .opt { font-family: var(--display); font-size: 12px; line-height: 1.7; }

.intro { margin: 0 0 22px; font-size: 18px; max-width: 62ch; }
.tally { color: var(--dim); margin: -6px 0 14px 24px; font-variant-numeric: tabular-nums; }
.beasts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
.beastlist { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.beast { grid-template-columns: 18px 3ch minmax(0, 1fr); }
.beast .num { color: var(--dim); font-variant-numeric: tabular-nums; }
.beast .name { font-family: var(--display); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
.beast .qty { color: var(--dim); font-variant-numeric: tabular-nums; }
.beast[aria-pressed="true"]::before { visibility: visible; }
.beast.ghost .name, .beast.ghost .num { color: var(--off); }
.beast.known .name, .beast.known .num { color: var(--dim); }
/* long lists scroll inside their own window, like an item menu, so the card beside them stays in view */
.beastlist { max-height: 470px; overflow-y: auto; overflow-x: hidden; padding-right: 6px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; overscroll-behavior: contain; }
.beastcard { border: 3px solid var(--border); border-radius: 9px; box-shadow: inset 0 0 0 2px var(--border-shade); padding: 14px 16px 16px; min-width: 0; }
.beastcard.pop { animation: pop .5s var(--spring); }
.plantpic { display: block; width: 100%; max-width: 288px; height: auto; margin: 0 auto 10px; image-rendering: pixelated; }
.botanical { margin: 2px 0 0; color: var(--dim); font-family: var(--read); font-style: italic; font-size: 18px; }
.facts .living { color: #7fd68a; } .facts .perished { color: #c98a6a; }
.fishpic { display: block; width: 100%; max-width: 288px; height: auto; margin: 0 auto 10px; image-rendering: pixelated; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; margin: 10px 0 0; }
.facts dt { color: var(--dim); } .facts dd { margin: 0; }
.pips { display: inline-flex; gap: 3px; margin-right: 10px; vertical-align: 1px; }
.pips i { width: 9px; height: 9px; border: 2px solid currentColor; opacity: .35; }
.pips i.on { background: currentColor; opacity: 1; }
.rarity.common { color: #c9c9d2; } .rarity.uncommon { color: #7fd68a; } .rarity.rare { color: #6fb7ff; } .rarity.epic { color: #c79bff; } .rarity.legendary { color: #ffd257; }
.fishbtn { display: block; width: 100%; padding: 0; margin: 0; background: none; border: 0; color: inherit; font: inherit; text-shadow: inherit; cursor: zoom-in; transition: transform .5s var(--spring); }
.fishbtn:hover, .fishbtn:focus-visible { transform: scale(1.04); outline: none; }
.fishbtn .hint { display: block; text-align: center; color: var(--dim); font-size: 14px; margin: -4px 0 8px; }
.fishbtn .hint::before { content: ""; display: inline-block; border-left: 8px solid var(--accent); border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-right: 6px; }
.lore { margin-top: 16px; font-size: 18px; font-style: italic; gap: 16px; }
.files { display: flex; flex-direction: column; gap: 8px; }
.file { grid-template-columns: 18px minmax(0, 1fr) auto; padding-block: 9px; }
.file.chosen { animation: chosen .12s steps(1) 2; }
@keyframes chosen { 50% { opacity: .2; } }
.file .name { font-family: var(--display); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
.file .date { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* an opened entry: translucent window that pops out over the screen */
#reader {
  position: fixed; inset: 0; z-index: 4; background: color-mix(in srgb, var(--bg) 72%, transparent);   /* the screen behind is dimmed well back so the open entry is the only thing to read */
  display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
#readerwin {
  width: min(100%, 880px); max-height: 100%; overflow-y: auto; padding: 32px 40px 28px;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--win-a) 97%, transparent), color-mix(in srgb, var(--win-b) 98%, transparent));   /* all but solid: nothing behind competes with the words */
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  box-shadow: inset 0 0 0 2px var(--border-shade), 0 0 0 2px #000, 0 18px 50px rgba(0, 0, 0, .6);
}
#readerwin:focus { outline: none; }
#readerwin.pop { animation: pop .9s var(--spring); }
@keyframes pop { from { transform: translateY(20px) scale(.76); opacity: 0; } 55% { opacity: 1; } to { transform: none; opacity: 1; } }
.meta { color: var(--dim); font-size: 15px; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 0 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.filehead { border-bottom: 2px solid rgba(255, 255, 255, .3); padding-bottom: 16px; margin-bottom: 26px; }
.post { max-width: 66ch; display: flex; flex-direction: column; gap: 22px; font-family: var(--read); font-size: 20px; line-height: 1.7; text-shadow: 0 1px 1px rgba(0, 0, 0, .5); }
.post, .beastcard, .filehead, #zoom p { overflow-wrap: anywhere; }   /* a very long word or address wraps instead of pushing the page wide */
.post > * { min-width: 0; max-width: 100%; }
.post p, .post ul, .post ol, .post blockquote { margin: 0; }
.post ul { padding-left: 1.4em; list-style: square; }
.post ol { padding-left: 1.6em; }
.post li::marker { color: var(--accent); }
.post a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.post code { font-family: var(--body); font-size: .85em; }
.post hr { width: 100%; border: 0; border-top: 2px solid rgba(255, 255, 255, .3); margin: 6px 0; }
.sub { color: var(--dim); margin: 14px 0 0 24px; }
/* ----- the quest log: a compact strip on the home screen (the entries above it are the main thing) ----- */
.questhead { margin: 26px 0 10px; padding-top: 16px; border-top: 2px solid rgba(255, 255, 255, .3); color: var(--dim); font-size: 11px; }
.quests { display: grid; grid-template-columns: repeat(auto-fit, minmax(max(min(180px, 100%), calc((100% - 16px) / 3)), 1fr)); gap: 8px; }   /* never more than three across; a fourth quest starts a new row */
.quest { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; width: 100%; padding: 8px 10px; text-align: left;
  border: 2px solid var(--border-shade); border-radius: 7px; overflow-wrap: anywhere; }
.quest::before { display: none; }
.quest:hover, .quest:focus-visible { transform: translateY(-2px); border-color: var(--border); }
.quest .name { grid-column: 1 / -1; font-family: var(--display); font-size: 10px; line-height: 1.7; }
.quest .when { grid-column: 1 / -1; color: #ffd257; font-size: 14.5px; line-height: 1.3; }
.qbar { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.qbar i { width: 7px; height: 7px; border: 2px solid var(--dim); opacity: .5; }
.qbar i.on { background: #7fd68a; border-color: #7fd68a; opacity: 1; }
/* the Quest Log screen: the same quest buttons, one to a row and roomier */
.questlog { display: grid; gap: 10px; margin-top: 12px; }
.questlog .quest { padding: 12px 14px; }
.questlog .quest .name { font-size: 12px; }
.questlog .quest .when { font-size: 16px; }
.quest .qparty { grid-column: 1 / -1; margin-top: 6px; color: var(--dim); font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.quest.fulfilled { opacity: .78; } .quest.fulfilled .when { color: #7fd68a; }
.qtags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 6px; font-size: 15px; color: var(--dim); }
.qkind { padding: 0 7px; border: 2px solid currentColor; border-radius: 5px; font-size: 13px; line-height: 1.5; }
.hard { display: inline-flex; align-items: center; white-space: nowrap; }
.hard.h1 { color: #9fd8a8; } .hard.h2 { color: #c8e08a; } .hard.h3 { color: #ffd257; } .hard.h4 { color: #ffa25c; } .hard.h5 { color: #ff7a6e; }
.qexp { color: #8fd6ff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.quest.fulfilled .qexp { color: #7fd68a; }
.qstats { margin: 4px 0 6px; } .qstats dd { overflow-wrap: anywhere; min-width: 0; }
.qcount { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; margin-top: 4px; }
#readerwin .meta .when { color: #ffd257; }
.goals li span { min-width: 0; overflow-wrap: anywhere; }
#readerwin .goals { font-size: 19px; gap: 9px; margin-top: 12px; }
/* inside the open entry or quest: the reading column sits in the middle, and each section stands clear of the last */
#readerwin > .post { margin-inline: auto; width: 100%; }
#readerwin > .qstats { margin: 28px 0 0; padding-top: 18px; border-top: 2px solid rgba(255, 255, 255, .3); gap: 6px 18px; }
#readerwin > .row { margin-top: 30px; }
#readerwin .posts { gap: 10px; margin-top: 14px; } #readerwin .petition { margin-top: 18px; }
.goalhead { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 0 0; padding-top: 16px; border-top: 2px solid rgba(255, 255, 255, .3); font-family: var(--display); font-size: 10px; line-height: 1.6; color: var(--accent); }
.goals { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 5px; }
/* the company of a quest and the form for asking to join it */
.party { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; }
.party li { padding: 2px 10px; border: 2px solid rgba(255, 255, 255, .45); border-radius: 6px; font-size: 17px; overflow-wrap: anywhere; min-width: 0; }
.partynote { margin: 8px 0 0; }
.posts { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.posts li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: center; padding: 8px 10px; border: 2px solid rgba(255, 255, 255, .35); border-radius: 6px; }
.posts .pwords { display: grid; gap: 2px; min-width: 0; } .posts .pname { font-family: var(--display); font-size: 11px; line-height: 1.7; } .posts .pabout { color: var(--dim); font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.posts .pholder { font-size: 16px; text-align: right; overflow-wrap: anywhere; min-width: 0; } .posts .held .pholder { color: #7fd68a; } .posts .vacant .pholder { color: #ffd257; }
.posts .papply { grid-column: 1 / -1; justify-self: start; margin-top: 4px; }
.petition select { display: block; width: 100%; max-width: 420px; box-sizing: border-box; font: inherit; font-size: 17px; padding: 8px 10px; border: 2px solid rgba(255, 255, 255, .6); border-radius: 6px; background: #0a0f3c; color: inherit; }
.petition { margin: 12px 0 4px; }
.petition label { display: block; margin: 10px 0 4px; color: var(--dim); font-size: 15px; }
.petition input { display: block; width: 100%; max-width: 420px; box-sizing: border-box; font: inherit; font-size: 17px; padding: 8px 10px; border: 2px solid rgba(255, 255, 255, .6); border-radius: 6px; background: rgba(0, 0, 20, .45); color: inherit; }
.petition input:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
.petition .opt { margin-top: 12px; } .petition .opt:disabled { opacity: .5; }
.petition .trap { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.goals li { display: grid; grid-template-columns: 13px minmax(0, 1fr); gap: 10px; align-items: start; color: var(--dim); }
.goals li.done { color: var(--fg); }
.goals .tick { position: relative; margin-top: 7px; width: 9px; height: 9px; border: 2px solid currentColor; background: #000; }
.goals li.done .tick { background: #7fd68a; border-color: #7fd68a; }
.goals li.done .tick::after { content: ""; position: absolute; left: 2px; top: -1px; width: 3px; height: 6px; border: solid #000; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.questdone { margin: 18px 0 0; } .pastquests { margin-left: 24px; }
/* ----- the status screen: portrait and level on the left, the numbers on the right ----- */
.sheet { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 22px; align-items: start; }
.who { border: 3px solid var(--border); border-radius: 9px; box-shadow: inset 0 0 0 2px var(--border-shade); padding: 16px 14px; text-align: center; overflow-wrap: anywhere; }
.portrait { display: block; width: 180px; height: 232px; max-width: 100%; margin: 0 auto 10px; image-rendering: pixelated; }
.who .class { margin: 4px 0 0; color: var(--dim); }
.who .level { margin: 12px 0 6px; font-family: var(--display); font-size: 12px; line-height: 1.7; color: #ffd257; }
.xpbar { height: 12px; border: 2px solid var(--border); background: rgba(0, 0, 0, .45); }
.xpbar i { display: block; height: 100%; background: #ffd257; }
/* the stat blocks that open the Bestiary, Herbarium and Map */
.meter { display: inline-flex; align-items: center; gap: 2px 10px; flex-wrap: wrap; max-width: 100%; }
.meter .xpbar { display: inline-block; width: min(160px, 22vw); height: 10px; flex: none; }
.qstats dd { min-width: 0; }
.tiers { display: inline-flex; flex-wrap: wrap; gap: 2px 14px; }
.regions { display: grid; gap: 4px; } .region { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.region .rname { flex: 0 0 min(100%, 21ch); } .region.mastered .xpbar i { background: #7fd68a; } .region.mastered { color: #7fd68a; }
.facts .earned { color: #7fd68a; } .facts .bounty { color: #8fd6ff; }
.who .tonext { margin: 6px 0 0; color: var(--dim); font-size: 15px; }
.who .home { margin: 12px 0 0; padding-top: 10px; border-top: 2px solid rgba(255, 255, 255, .3); display: grid; gap: 2px; }
.who .home span:first-child { color: var(--dim); font-size: 15px; }
.stats { margin: 0; gap: 8px 18px; } .stats dd { text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.sheet + .lore { margin-top: 18px; }
.sheetcol { min-width: 0; } .sheethead { margin: 20px 0 8px; padding-top: 12px; border-top: 2px solid rgba(255, 255, 255, .3); color: var(--dim); font-size: 11px; }
.ledger dd { display: flex; justify-content: flex-end; gap: 6px 14px; flex-wrap: wrap; } .ledger .how { color: var(--dim); font-size: 15px; text-align: right; } .ledger .xp { min-width: 4ch; text-align: right; }
.ledger .total { margin-top: 6px; padding-top: 6px; border-top: 2px solid rgba(255, 255, 255, .3); } .ledger dd.total .xp { color: #ffd257; }
/* ----- photo albums ----- */
.albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.album { display: block; width: 100%; padding: 0; text-align: left; }
.album::before { display: none; }
.album:hover, .album:focus-visible { transform: translateY(-4px); }
.album .cover { display: block; aspect-ratio: 4 / 3; background: #000; border: 3px solid var(--border); border-radius: 6px; overflow: hidden; }
.album:focus-visible .cover { box-shadow: 0 0 0 3px var(--accent); }
.album .cover img, .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.album .name { display: block; font-family: var(--display); font-size: 12px; line-height: 1.8; margin-top: 8px; overflow-wrap: anywhere; }
.album .date { display: block; color: var(--dim); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
.thumb { aspect-ratio: 1; position: relative; }

<script>
/* ==========================================================================
   HOW THIS PAGE WORKS

   This one file is the whole site: the look (the <style> block above), the
   skeleton of the screen (the HTML just above this script), and everything
   the page does (this script).

   Nothing you write lives in this file. Every entry, fish, album, map pin
   and quest is its own small file in a folder (posts/, bestiary/, albums/,
   places/, quests/, pages/), made with the editor at app.pagescms.org.
   scripts/build-index.mjs gathers them all into posts.json, and this page
   loads that one file when it opens (see section 15).

   The fish and plant pictures are one image, sprites.png, with a short list
   beside it (sprites.json) saying where each picture is. Both are loaded at
   the same moment. They are drawn by the scripts in tools/sprites.

   The screen is a set of windows. The big one (#main) shows one screen at a
   time; each screen is drawn by a function named show...(): showFiles (the
   home screen), showQuestLog, showBestiary, showPhotos, showAlbum, showMap, showPage.
   Two things can pop out over the windows: #reader (an entry or a quest)
   and #zoom (an enlarged photo). The title screen (#intro) covers it all
   until Start is pressed.

   Everything on the page is built as elements, never pasted in as raw HTML,
   so nothing typed into the editor can run as code.

   Privacy: the site is public. Quests carry no dates on purpose, and the
   page saves nothing about visitors except whether they turned the music
   off and a short note of what it last showed them (so it can say what is
   new next time). Both stay on their own device.

   CONTENTS
      1. Content            what gets loaded from posts.json
      2. Helpers            small tools used everywhere
      3. Home screen        the log, the quest log, and simple pages (About, Help)
   3b. Chronicle         one dated list of everything recorded
      4. Bestiary           the fish pictures and the fish screen
   4b. Herbarium         the plant pictures and the plant screen
   4c. Moving pictures   the leaping fish
      5. Entry text         turning what the editor saves into paragraphs, photos, links
      6. Pop-out window     an opened entry, quest or companion
      7. Photo viewer       one enlarged photo, or a set to step through
      8. Photo albums       the Photos screens
      9. Map                the coastline, pins, landmarks, and the Map screen
   9b. Status            the character sheet, counted from everything else
   9c. Honours           the medals
     10. Menu and keyboard
     11. Title screen
     12. The figure         the pixel figure of Chris and how he moves
     13. Drifting sparkles  the background
     14. Music
  14b. Moments           the banners for what is new since the last visit
     15. Loading and start  fetches posts.json, tidies it, draws the first screen
   ========================================================================== */

/* ==========================================================================
   1. CONTENT
   Filled in from posts.json when the page opens (section 15). Empty until then.
   ========================================================================== */
let ABOUT = "";          /* the About text, loaded from posts.json */
let BESTIARY_INTRO = "";   /* the short blurb at the top of the Bestiary, loaded from posts.json */
let ALBUMS = [];         /* photo albums, newest first, loaded from posts.json */
let STATUS = { name: "", class: "", home: "", body: "" };   /* the character on the Status screen, loaded from posts.json */
let PLANTS = [];         /* the herbarium: bonsai and house plants, loaded from posts.json */
let PLANT_INTRO = { bonsai: "", house: "" };   /* the notice at the top of each collection */
let QUESTS = [];         /* things set out to do, with objectives, loaded from posts.json */
let PLACES = [];         /* map pins, loaded from posts.json */
let BESTIARY = [];       /* the creatures, loaded from posts.json */
let sorted = [];         /* the entries, newest first, loaded from posts.json */
let loadNote = "Loading...";   /* shown in the log while there is nothing to list */
const HELP = `## Touch or mouse

Select an entry to open it. Select Back, or tap outside the window, to close it.

## Keyboard

- Up / Down: move cursor
- Left / Right: switch window
- Enter: confirm
- Esc: cancel

## Map

Drag to move. Pinch, or use + and -, to zoom. Point at a pin or a name to see the place and its landmarks. Each landmark is drawn as a small picture: in colour once visited, a dark locked shape until then. Where they crowd together some shrink to dots; zoom in to see them. Point at one to name it.

## Experience

Nearly everything here pays experience: an entry written, a species caught (rarer pays more), a plant kept alive, a landmark seen, a place reached, a quest fulfilled. It adds up to the level, and the Status screen shows exactly where every point came from. Each collection also keeps its own standing, a rank earned by doing that one thing; the top rank of a collection is reached by finishing it.

## Quests

The Quests tab is the full log: what is in hand, and what has been fulfilled. Each quest has a difficulty and pays experience when it is finished; harder ones and Great Works pay more. Open a quest to see who travels with it. Some quests have named posts to fill: choose Apply beside an open one. Otherwise choose Petition to join. Either way you give a name of your choosing and an e-mail address. No account is needed, only what you write is kept, and the address is seen by the keeper alone. Each newcomer chooses a calling and a curiosity to set out with, and is then drawn a figure by lot, with a past to match. They may draw again as often as they please before sending; once sent it is theirs, and signing again with the same address keeps it. The keeper accepts or declines in his own time. Those accepted are entered under The Company at the foot of the Quest Log, each with a figure and a page of their own.

## A quest fulfilled

A finished quest opens with its report: a grade, the experience it paid, everyone who was there and what it earned them, and the keeper's account of how it went. Companions have a level of their own; it rises with every quest they see through. Choose Share to make a card of the report, or of any companion, to send to a friend.

## Chronicle

The Chronicle is everything recorded here, in the order it happened, newest first. Choose a row to go to the thing itself.

## Honours

Medals for particular feats are shown on the Status screen: in colour once won, a dark locked shape until then. They pay no experience.

## What is new

When something has been earned since you last looked in, a banner says so. To know what is new, this page keeps a short note in your own browser of what it last showed you. The note never leaves your device.`;

/* ==========================================================================
   2. HELPERS
   ========================================================================== */
const $ = (s) => document.querySelector(s);                       /* find one thing on the page */
const text = (v) => (typeof v === "string" ? v : typeof v === "number" ? String(v) : "");        /* whatever was loaded, as plain text ("" if it is not text) */
const amount = (v) => { const n = parseFloat(v); return Number.isFinite(n) && n > 0 ? n : null; };   /* a positive number, or nothing */
const count = (n, word) => n + " " + word + (n === 1 ? "" : "s");                                /* "1 photo", "3 photos" */
/* make a new element: its tag, its class, and the text inside it */
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {   /* the visitor's saved choices; storage can be blocked, so never let it throw */
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
/* "2026-10-04" as "Oct 4, 2026"; anything that is not a real date gives "" */
const day = (d) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m && MONTHS[+m[2] - 1] && +m[3] >= 1 && +m[3] <= 31 ? MONTHS[+m[2] - 1] + " " + +m[3] + ", " + m[1] : ""; };

const stage = $("#stage"), main = $("#main"), menu = $("#menu"), reader = $("#reader"), rwin = $("#readerwin"), zoomBox = $("#zoom"), introBox = $("#intro");
let view = "files";      /* which screen the main window shows: files, quests, chron, bestiary, plants, photos, album, map, status, about or help */
let current = null;      /* the entry open in the pop-out window, if any */

/* put an entry's name after # in the address (so the link can be shared), or clear it */
function setHash(h) { try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) {} }
function opt(text, onClick, cls) {   /* a selectable menu option */
  const b = el("button", "opt" + (cls ? " " + cls : ""), text); b.type = "button";
  if (onClick) b.addEventListener("click", onClick);
  return b;
}
/* Anything layered on top (title screen, open entry, enlarged photo) makes the menu behind it unreachable. */
function syncLayers() { stage.inert = !introBox.classList.contains("done") || !reader.hidden || !zoomBox.hidden; }

/* ==========================================================================
   3. HOME SCREEN AND SIMPLE PAGES
   The home screen lists the log entries, then the quest log beneath them.
   About and Help are plain pages of text.
   ========================================================================== */
/* Every screen starts the same way: note which screen is up, empty the main window, move the menu's marker. */
function openScreen(name, menuId) {
  view = name; main.textContent = ""; stopAnim();
  menu.querySelectorAll(".opt").forEach((b) => { if (b.id !== "m-music") b.setAttribute("aria-current", String(b.id === menuId)); });
}
/* the "Back" option at the foot of a screen: returns to the home screen */
function backRow() { const nav = el("div", "row group"); nav.append(opt("Back", () => showFiles(true))); return nav; }

/* the home screen */
function showFiles(focusFirst) {
  openScreen("files", "m-files");
  const list = el("div", "files");
  sorted.forEach((p, i) => {
    const b = opt(null, () => {   /* flash the chosen row, then open it */
      if (reduceMotion) return showPost(p);
      if (b.classList.contains("chosen")) return;
      b.classList.add("chosen");
      setTimeout(() => { b.classList.remove("chosen"); if (b.isConnected && reader.hidden) showPost(p); }, 250);
    }, "file"); b.dataset.file = p.file;
    b.append(el("span", "name", p.title), el("span", "date", day(p.date)));
    b.style.setProperty("--i", i);
    list.append(b);
  });
  main.append(list);
  if (!sorted.length) main.append(el("p", "sub", loadNote));
  showQuests(); showLately();
  if (focusFirst) { const f = list.querySelector(".opt"); if (f) f.focus(); }
}
/* ----- the quest log: a small strip under the entries. Each quest shows its name, a vague "when" and
   how many objectives are done; choosing one opens it in the pop-out window. Real dates and place
   names are kept out of quests on purpose, because the site is public. ----- */
function showQuests() {
  if (!QUESTS.length) return;
  const active = QUESTS.filter((q) => q.status !== "completed"), done = QUESTS.filter((q) => q.status === "completed");
  const head = el("p", "label questhead", "Quests"), wrap = el("div", "quests");
  active.forEach((q, i) => {
    const got = q.objectives.filter((o) => o.done).length, b = opt(null, () => showQuest(q, b), "quest"), bar = el("span", "qbar");
    q.objectives.slice(0, 12).forEach((o) => bar.append(el("i", o.done ? "on" : null)));   /* one small square per objective, lit when done */
    b.append(el("span", "name", q.title), el("span", "when", q.when), bar, el("span", "qcount", q.objectives.length ? got + "/" + q.objectives.length : ""));
    b.style.setProperty("--i", Math.min(i, 6));
    wrap.append(b);
  });
  main.append(head, wrap);
  if (done.length) {
    const past = el("ul", "goals pastquests");
    done.forEach((q) => { const li = el("li", "done"); li.append(el("span", "tick"), el("span", null, q.title)); past.append(li); });
    main.append(el("p", "sub questdone", "Completed"), past);
  }
}
/* The Quest Log screen: every quest in full, the open ones first and the fulfilled ones kept below as a record.
   The home screen shows the same open quests as a short strip (showQuests above); both open the same pop-out. */
/* The game side of a quest. Difficulty runs 1 to 5; the sort of quest scales what it pays; a quest can also name
   its own experience. Experience is only earned when the quest is fulfilled (each objective ticked along the way
   pays a little by itself: see tally() in section 9b). */
const HARDNESS = ["", "Trifling", "Modest", "Arduous", "Perilous", "Ruinous"], PAYS = [0, 30, 60, 100, 160, 250];
const QUEST_KINDS = { main: ["Great Work", 1.5], side: ["Venture", 1], errand: ["Errand", .5] };
const questExp = (q) => (q.exp != null ? q.exp : Math.round(PAYS[q.difficulty] * QUEST_KINDS[q.kind][1] / 5) * 5);
const QUEST_RANKS = [[0, "Unproven"], [1, "Runner of Errands"], [3, "Journeyman of Small Matters"], [6, "Adept of the Road"], [10, "Veteran of Many Ends"], [16, "Finisher of Things"], [25, "One Whom Tasks Avoid"]];
function questTally() {   /* the keeper's standing as a finisher of quests */
  const done = QUESTS.filter((q) => q.status === "completed"), earned = done.reduce((n, q) => n + questExp(q), 0);
  const offered = QUESTS.filter((q) => q.status !== "completed").reduce((n, q) => n + questExp(q), 0);
  const r = rankOf(QUEST_RANKS, done.length), rank = [0, r.name], next = r.next ? [r.next.need + done.length, r.next.name] : null;
  const hardest = done.slice().sort((a, b) => b.difficulty - a.difficulty || questExp(b) - questExp(a))[0] || null;
  return { done: done.length, open: QUESTS.length - done.length, earned, offered, rank: rank[1], next: next ? [next[1], next[0] - done.length] : null, hardest };
}
function questTags(q) {   /* one line: what sort, how hard, what it pays */
  const line = el("span", "qtags"), hard = el("span", "hard h" + q.difficulty);
  hard.append(pips(q.difficulty), el("span", null, HARDNESS[q.difficulty]));
  hard.setAttribute("aria-label", "Difficulty " + q.difficulty + " of 5, " + HARDNESS[q.difficulty]);
  line.append(el("span", "qkind", QUEST_KINDS[q.kind][0]), hard, el("span", "qexp", (q.status === "completed" ? "" : "+") + questExp(q) + " EXP" + (q.status === "completed" ? " earned" : "")));
  return line;
}
function questRow(q, i) {
  const got = q.objectives.filter((o) => o.done).length, b = opt(null, () => showQuest(q, b), "quest" + (q.status === "completed" ? " fulfilled" : "")), bar = el("span", "qbar");
  const ro = roster(q), names = (owns(PARTY, q.file) ? PARTY[q.file] : []).map((m) => m.name);
  q.objectives.slice(0, 24).forEach((o) => bar.append(el("i", o.done ? "on" : null)));
  b.append(el("span", "name", q.title), el("span", "when", q.status === "completed" ? "Fulfilled" + (q.completed ? " " + day(q.completed) : "") + "   Grade " + questGrade(q) : q.when), questTags(q), bar, el("span", "qcount", q.objectives.length ? got + "/" + q.objectives.length : ""));
  if (q.reward) b.append(el("span", "qparty", "Spoils: " + q.reward));
  if (names.length) b.append(el("span", "qparty", "Company of " + (names.length + 1) + ": the keeper, " + names.join(", ")));
  else if (partyOpen && q.status !== "completed" && !ro.posts.length) b.append(el("span", "qparty", "Seeking companions"));
  if (ro.posts.length) b.append(el("span", "qparty", "Posts: " + ro.filled + " of " + ro.posts.length + " filled" + (ro.filled < ro.posts.length && q.status !== "completed" ? "  -  seeking " + ro.posts.filter((p) => !p.holder).map((p) => p.name).join(", ") : "")));
  b.style.setProperty("--i", Math.min(i, 6));
  return b;
}
function showQuestLog(focusFirst) {
  openScreen("quests", "m-quests");
  const open = QUESTS.filter((q) => q.status !== "completed"), done = QUESTS.filter((q) => q.status === "completed");
  main.append(el("p", "label", "Quest Log"));
  const intro = el("div", "post intro");
  intro.append(el("p", null, "Here are entered the undertakings of the keeper: those in hand, and below them those brought to an end. An undertaking is struck from the first list only by being finished. Abandonment is not recorded, there being no column for it."));
  main.append(intro);
  if (!QUESTS.length) { main.append(el("p", "sub", loadNote === "Loading..." ? loadNote : "No undertakings are in hand."), backRow()); return; }
  const t = questTally(), facts = el("dl", "facts qstats"), fact = (k, v) => facts.append(el("dt", null, k), el("dd", null, v));
  fact("Standing", t.rank + (t.next ? "  (" + t.next[1] + " more to " + t.next[0] + ")" : ""));
  fact("Quests", t.open + " in hand  /  " + t.done + " fulfilled");
  fact("Experience", t.earned + " earned  /  " + t.offered + " on offer");
  if (t.hardest) fact("Hardest fulfilled", t.hardest.title + " (" + HARDNESS[t.hardest.difficulty] + ")");
  main.append(facts);
  const list = el("div", "questlog"); open.forEach((q, i) => list.append(questRow(q, i)));
  if (open.length) main.append(list); else main.append(el("p", "sub", "Nothing is in hand. The keeper is, for the moment, at liberty."));
  if (done.length) {
    const past = el("div", "questlog"); done.sort((a, b) => b.completed.localeCompare(a.completed)).forEach((q, i) => past.append(questRow(q, i)));   /* most recently finished first */
    main.append(el("p", "label questhead", "Fulfilled"), past);
  }
  showCompany();
  main.append(backRow());
  if (focusFirst) { const f = main.querySelector(".quest") || main.querySelector(".opt"); if (f) f.focus(); }
}
/* a plain page of text: About or Help */
function showPage(name, menuId, label, text) {
  openScreen(name, menuId);
  const body = el("div", "post"); renderBody(text, body);
  if (!body.firstChild) body.append(el("p", "sub", loadNote === "Loading..." ? loadNote : "Nothing here yet."));
  main.append(el("p", "label", label), body, backRow());
}

/* ==========================================================================
   3b. CHRONICLE
   One dated list of everything recorded on the site, newest first: entries
   written, fish caught, places reached, quests fulfilled, plants taken in,
   albums filed, companions joined. Nothing is typed in here by hand: it is
   gathered from the dates already given elsewhere. A thing with no date is
   left out. The home screen shows the latest few under "Lately".
   ========================================================================== */
const CHRON = { entry: "Log", fish: "Catch", place: "Road", quest: "Quest", plant: "Green", album: "Likeness", company: "Company" };   /* the tag shown beside each kind of happening */
function chronicle() {
  const out = [], add = (date, kind, words, go, exp) => { if (day(date)) out.push({ date: date.slice(0, 10), kind, words, go, exp: exp || 0 }); };
  sorted.forEach((p) => add(p.date, "entry", "Wrote " + p.title, (from) => showPost(p, from), PAY.entry));
  const seen = new Set();   /* only the first catch of a species pays */
  BESTIARY.forEach((b, i) => {
    if (b.status === "wanted") return; const k = b.name.trim().toLowerCase(), first = !seen.has(k); seen.add(k);
    add(b.date, "fish", "Caught a " + b.name + (b.location ? " at " + b.location : ""), () => showBestiary(true, i), first ? fishExp(b) : 0);
  });
  PLACES.forEach((p) => { if (p.kind !== "region") add(p.date, "place", (p.kind === "home" ? "Settled in " : "Reached ") + p.name + (p.trip ? ", on the road through " + p.trip : ""), () => showMap(true, p.file), MAP_EXP.place); });
  QUESTS.forEach((q) => { if (q.status === "completed") add(q.completed, "quest", "Fulfilled " + q.title, (from) => showQuest(q, from), questExp(q)); });
  PLANTS.forEach((p) => add(p.acquired, "plant", "Took in " + p.name + (p.count > 1 ? " (" + p.count + ")" : ""), () => showPlants(p.kind, true)));
  ALBUMS.forEach((a) => add(a.date, "album", "Filed the likenesses of " + a.title, () => showAlbum(a), PAY.album));
  companions().forEach((c) => c.posts.forEach((x) => add(x.at, "company", c.name + " threw in with " + x.quest.title + (x.role ? " as " + x.role : ""), (from) => showCompanion(c, from))));
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
function chronRow(ev, i) {
  const b = opt(null, () => ev.go(b), "chron k-" + ev.kind);
  b.append(el("span", "cdate", day(ev.date).split(",")[0]), el("span", "ctag", CHRON[ev.kind]), el("span", "cwords", ev.words), el("span", "cexp", ev.exp ? "+" + ev.exp : ""));
  b.style.setProperty("--i", Math.min(i, 8));
  return b;
}
let chronKind = "";   /* which kind of happening the Chronicle is narrowed to; "" shows all */
function showChronicle(focusFirst) {
  openScreen("chron", "m-chron");
  main.append(el("p", "label", "Chronicle"));
  const intro = el("div", "post intro");
  intro.append(el("p", null, "What follows is the record entire, set down in the order it befell, the latest first. Matters that carry no date are omitted, the chronicler declining to guess."));
  main.append(intro);
  const all = chronicle();
  if (!all.length) { main.append(el("p", "sub", loadNote === "Loading..." ? loadNote : "Nothing here carries a date as yet."), backRow()); return; }
  const kinds = Object.keys(CHRON).filter((k) => all.some((e) => e.kind === k)); if (!kinds.includes(chronKind)) chronKind = "";
  const tabs = el("div", "chips");
  [""].concat(kinds).forEach((k) => {
    const n = k ? all.filter((e) => e.kind === k).length : all.length, b = el("button", "chip", (k ? CHRON[k] : "All") + "  " + n); b.type = "button"; b.setAttribute("aria-pressed", String(k === chronKind));
    b.addEventListener("click", () => { chronKind = k; showChronicle(false); const now = [...main.querySelectorAll(".chip")].find((c) => c.getAttribute("aria-pressed") === "true"); if (now) now.focus({ preventScroll: true }); });
    tabs.append(b);
  });
  main.append(tabs);
  const list = el("div", "chronlist"); let month = "";
  all.filter((e) => !chronKind || e.kind === chronKind).forEach((e, i) => {
    const m = MONTHS[+e.date.slice(5, 7) - 1] + " " + e.date.slice(0, 4);
    if (m !== month) { month = m; list.append(el("p", "cmonth", m)); }
    list.append(chronRow(e, i));
  });
  main.append(list, backRow());
  if (focusFirst) { const f = list.querySelector(".opt"); if (f) f.focus({ preventScroll: true }); }
}
/* the latest few happenings, under the quests on the home screen (entries are left out: they are listed just above) */
function showLately() {
  const recent = chronicle().filter((e) => e.kind !== "entry").slice(0, 3); if (!recent.length) return;
  const list = el("div", "chronlist"); recent.forEach((e, i) => list.append(chronRow(e, i)));
  const more = el("div", "row"); more.append(opt("The whole chronicle", () => showChronicle(true)));
  main.append(el("p", "label questhead", "Lately"), list, more);
}

/* ==========================================================================
   4. BESTIARY
   A list of fish on the left, the chosen one's card on the right.
   The pictures are all on one sheet, sprites.png, fetched once when the page
   loads (see section 15); sprites.json says where on the sheet each one is.
   Each is 144 pixels square, in full colour, already drawn in its pose with
   its splash. There is one picture per species, found by the entry's file name
   ("001-rainbow-trout" uses "rainbow-trout"); a species with no picture of
   its own falls back to the general picture for its kind (FISH_ALIAS).
   drawFish() copies a picture onto the page. A fish not yet caught is drawn
   as a dark shape with a pale edge.
   The pictures are made by the scripts in tools/sprites; nothing on this
   page needs to understand how.
   ========================================================================== */
let FISH_SIZE = [144, 144], FISH = {}, FISH_ALIAS = {}, SHEET = null;   /* filled in from sprites.json and the picture sheet it names */
const owns = (o, k) => !!o && typeof k === "string" && Object.prototype.hasOwnProperty.call(o, k);
/* One picture out of the sheet, as raw pixels (four numbers each: red, green, blue, and how solid). where: its
   [column, row] in the sheet. In these pictures the creature is fully solid (255) and the water one step less
   (254), which is how the page tells them apart. Gives nothing if the pictures did not load. */
const cutOuts = new Map();
function pixelsOf(where) {
  if (!SHEET || !Array.isArray(where) || !(where[0] >= 0) || !(where[1] >= 0)) return null;
  const key = where[0] + "," + where[1], [W, H] = FISH_SIZE; if (cutOuts.has(key)) return cutOuts.get(key);
  let d = null; try { if ((where[0] + 1) * W <= SHEET.canvas.width && (where[1] + 1) * H <= SHEET.canvas.height) d = SHEET.getImageData(where[0] * W, where[1] * H, W, H); } catch (e) {}

      name: text(b.name).trim() || "Unknown", sprite: text(b.sprite) || "fish", file: text(b.file).replace(/^\d+-/, ""), date: text(b.date), weight: amount(b.weight), length: amount(b.length),
      location: text(b.location), photo: text(b.photo), lore: text(b.lore), status: text(b.status) === "wanted" ? "wanted" : "caught",
      rarity: Object.prototype.hasOwnProperty.call(RARITY, text(b.rarity)) ? text(b.rarity) : "", lure: text(b.lure),
      catch_rate: Math.min(100, amount(b.catch_rate) || 0) || null, fight: Math.min(5, Math.round(amount(b.fight) || 0)) || null }));
    BESTIARY = BESTIARY.filter((b) => b.status !== "wanted").concat(BESTIARY.filter((b) => b.status === "wanted"));   /* caught first, then the ones still at large */
    ALBUMS = (Array.isArray(data.albums) ? data.albums : []).filter((a) => a && typeof a === "object" && text(a.file)).map((a) => ({
      file: text(a.file), title: text(a.title) || text(a.file), date: text(a.date), place: text(a.place), body: text(a.body),
      photos: (Array.isArray(a.photos) ? a.photos : []).map(text).filter(Boolean),
      captions: (Array.isArray(a.captions) ? a.captions : []).filter((c) => c && typeof c === "object" && text(c.photo) && text(c.caption)).map((c) => ({ photo: text(c.photo), caption: text(c.caption) })) }))
      .map((a) => { for (const c of a.captions) if (!a.photos.includes(c.photo)) a.photos.push(c.photo); return a; });   /* a captioned photo that was not in the list still belongs to the album */
    PLACES = (Array.isArray(data.places) ? data.places : []).filter((p) => p && typeof p === "object").map((p, i) => {
      const lat = typeof p.lat === "number" ? p.lat : NaN, lng = typeof p.lng === "number" ? p.lng : NaN, good = Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
      return { file: text(p.file) || "place-" + i, name: text(p.name).trim() || "Unnamed place", kind: Object.prototype.hasOwnProperty.call(KINDS, text(p.kind)) ? text(p.kind) : "landmark",
        lat: good ? lat : null, lng: good ? lng : null, date: text(p.date), photo: text(p.photo), note: text(p.note),
        trip: text(p.trip).trim(), stop: typeof p.stop === "number" && Number.isFinite(p.stop) ? p.stop : null,
        landmarks: (Array.isArray(p.landmarks) ? p.landmarks : []).filter((l) => l && typeof l === "object" && text(l.name).trim()).map((l) => {
          const at = typeof l.lat === "number" && typeof l.lng === "number" && Math.abs(l.lat) <= 90 && Math.abs(l.lng) <= 180;
          return { name: text(l.name).trim(), icon: text(l.icon), visited: l.visited === true, lat: at ? l.lat : null, lng: at ? l.lng : null };
        }) };
    });
    const kindOrder = Object.keys(KINDS);   /* list order: by kind, then trips together in stop order, then by name */
    PLACES.sort((a, b) => kindOrder.indexOf(a.kind) - kindOrder.indexOf(b.kind) || a.trip.localeCompare(b.trip) ||
      (a.stop == null ? 1e9 : a.stop) - (b.stop == null ? 1e9 : b.stop) || a.name.localeCompare(b.name));
    const st = data.status && typeof data.status === "object" ? data.status : {};
    STATUS = { name: text(st.name).trim(), class: text(st.class).trim(), home: text(st.home).trim(), body: text(st.body) };
    PLANTS = (Array.isArray(data.plants) ? data.plants : []).filter((p) => p && typeof p === "object").map((p) => ({
      name: text(p.name).trim() || "Unnamed plant", botanical: text(p.botanical), kind: text(p.kind) === "bonsai" ? "bonsai" : "house", sprite: text(p.sprite) || "plant", file: text(p.file).replace(/^\d+-/, ""),
      status: text(p.status) === "perished" ? "perished" : "living", count: Math.max(1, Math.min(999, Math.round(amount(p.count) || 1))),
      rarity: Object.prototype.hasOwnProperty.call(RARITY, text(p.rarity)) ? text(p.rarity) : "", temper: Math.min(5, Math.round(amount(p.temper) || 0)) || null,
      light: text(p.light), water: text(p.water), acquired: text(p.acquired), photo: text(p.photo), lore: text(p.lore) }));
    const intro = data.plants_intro && typeof data.plants_intro === "object" ? data.plants_intro : {};
    PLANT_INTRO = { bonsai: text(intro.bonsai), house: text(intro.house) };
    QUESTS = (Array.isArray(data.quests) ? data.quests : []).filter((q) => q && typeof q === "object" && text(q.title).trim()).map((q) => ({
      file: text(q.file), title: text(q.title).trim(), status: text(q.status) === "completed" ? "completed" : "active",
      difficulty: Math.min(5, Math.max(1, Math.round(amount(q.difficulty) || 2))), kind: owns(QUEST_KINDS, text(q.kind)) ? text(q.kind) : "side", reward: text(q.reward).trim(), grade: text(q.grade), commended: text(q.commended).trim().slice(0, 40), album: text(q.album).trim(), report: text(q.report),
      roles: (Array.isArray(q.roles) ? q.roles : []).filter((r) => r && typeof r === "object" && text(r.name).trim()).slice(0, 12).map((r) => ({ name: text(r.name).trim().slice(0, 60), about: text(r.about).trim(), held: text(r.held).trim().slice(0, 40) })),
      exp: typeof q.exp === "number" && Number.isFinite(q.exp) ? Math.min(9999, Math.max(0, Math.round(q.exp))) : null, completed: /^\d{4}-\d{2}-\d{2}/.test(text(q.completed)) ? text(q.completed).slice(0, 10) : "", order: typeof q.order === "number" && Number.isFinite(q.order) ? q.order : 1e9, when: text(q.when), place: text(q.place), body: text(q.body),
      objectives: (Array.isArray(q.objectives) ? q.objectives : []).filter((o) => o && typeof o === "object" && text(o.text).trim()).map((o) => ({ text: text(o.text).trim(), done: o.done === true })) }))
      .sort((a, b) => a.order - b.order || a.title.localeCompare(b.title));
    sorted = (Array.isArray(data.posts) ? data.posts : []).filter((p) => p && typeof p === "object" && text(p.file)).map((p) => ({
      file: text(p.file), title: text(p.title) || text(p.file), date: text(p.date), place: text(p.place), body: text(p.body) }))
      .sort((a, b) => b.date.localeCompare(a.date) || b.file.localeCompare(a.file));
    loadNote = "No entries yet.";
  } catch (e) { ABOUT = ""; BESTIARY_INTRO = ""; BESTIARY = []; ALBUMS = []; PLACES = []; QUESTS = []; PLANTS = []; PLANT_INTRO = { bonsai: "", house: "" }; sorted = []; loadNote = "Could not load the log. Refresh to try again."; }
  $("#count").textContent = sorted.length; $("#lvl").textContent = tally().level;
  $("#latest").textContent = sorted[0] ? day(sorted[0].date).split(",")[0] || "-" : "-";
  pendingPost = linkedPost();
  const started = introBox.classList.contains("done");
  if (view === "files" && reader.hidden) showFiles(started);   /* redraw whichever screen is up, now that there is something to show */
  if (view === "bestiary") showBestiary(started);
  if (view === "plants") showPlants(plantsKind, started);
  if (view === "status") showStatus(started);
  if (view === "quests") showQuestLog(started);
  if (view === "chron") showChronicle(started);
  if (view === "photos" || view === "album") showPhotos(started);
  if (view === "map") showMap(started);
  drawMini(); loadLand().then(drawMini); loadParty().then(moments);
  if (view === "about") showPage("about", "m-about", "About", ABOUT);
  if (pendingPost && started) { showPost(pendingPost); pendingPost = null; }
})();
window.addEventListener("hashchange", () => {   /* following a link to another entry while the page is open */
  const p = linkedPost();
  if (p && p !== current && introBox.classList.contains("done")) { if (!zoomBox.hidden) unzoom(); showPost(p); }
});
startSprite();
$("#startbtn").focus();
</script>
