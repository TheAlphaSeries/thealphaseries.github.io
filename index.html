<body>
<style>
/* Layout: a 16-bit RPG menu screen. Help window across the top, a large main window
   (log list / config), a command window and a status window on the right.
   An opened entry pops out over the screen as a translucent window.
   Single dark look by choice; the window color is a Config option, as in the genre. */
:root {
  color-scheme: dark;
  --win-a: #1c1c1c;       /* window gradient, top */
  --win-b: #000000;       /* window gradient, bottom */
  --accent: #ffffff;      /* cursor, headings */
  --bg: color-mix(in srgb, var(--win-b) 28%, #000);            /* field behind the windows */
  --veil: color-mix(in srgb, var(--bg) 62%, transparent);
  --border: #f6f2ff;                                            /* window frame */
  --border-shade: color-mix(in srgb, var(--win-a) 45%, #c4c4cc);/* inner frame line */
  --fg: #ffffff;
  --dim: color-mix(in srgb, var(--win-a) 22%, #fff);            /* dates, captions */
  --off: color-mix(in srgb, var(--win-a) 48%, #fff);            /* unavailable commands */
  --alert: #ffb0a4;
  --hl: rgba(255, 255, 255, .13);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --display: "Press Start 2P", "Courier New", monospace;
  --body: "DotGothic16", ui-monospace, Menlo, monospace;
  --read: "Newsreader", Georgia, "Times New Roman", serif;   /* long-form reading text */
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 17px; line-height: 1.7;
  padding-inline: 16px; padding-block: 20px 32px;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, .7);
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.stage {
  position: relative; z-index: 1;
  max-width: 960px; margin-inline: auto;
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr) 220px;
  grid-template-areas: "help help" "main menu" "main status";
  grid-template-rows: auto auto 1fr;
}
.win {
  background: linear-gradient(to bottom, var(--win-a), var(--win-b));
  border: 3px solid var(--border); border-radius: 9px;
  box-shadow: inset 0 0 0 2px var(--border-shade), 0 0 0 2px #000;
  padding: 14px 16px; min-width: 0;
}
#help { grid-area: help; }
#help .site { font-family: var(--display); font-size: 13px; line-height: 1.6; color: var(--accent); }
#helptext { flex: 1 1 20ch; min-width: 0; }
#helptext.bad { color: var(--alert); }
#main { grid-area: main; min-height: 440px; padding: 20px 20px 22px; }
#menu { grid-area: menu; display: flex; flex-direction: column; gap: 4px; }
#status { grid-area: status; align-self: start; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-variant-numeric: tabular-nums; }
#status dt { color: var(--dim); } #status dd { margin: 0; text-align: right; }
dl { margin: 0; }

h1, h2, h3, .label { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h1 { font-size: 18px; line-height: 1.6; }
h2 { font-size: 17px; line-height: 1.6; }
h3 { font-size: 12px; line-height: 1.7; color: var(--accent); margin-top: 8px; }
.label { color: var(--accent); font-size: 12px; line-height: 1.6; letter-spacing: .06em; margin-bottom: 14px; }

/* a selectable option: the cursor appears on hover / focus, and the row leans out on a soft spring */
.opt {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 0 6px; align-items: baseline;
  width: 100%; padding: 6px 4px; text-align: left;
  background: none; border: 0; border-radius: 4px; color: inherit; font: inherit; text-shadow: inherit; cursor: pointer;
  transition: transform .5s var(--spring);
}
.opt::before {
  content: ""; width: 0; height: 0; align-self: center; visibility: hidden;
  border-left: 10px solid var(--accent); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  filter: drop-shadow(1px 1px 0 rgba(0, 0, 0, .7));
}
.opt:hover, .opt:focus-visible { transform: translateX(6px); }
.opt:active { transform: translateX(2px) scale(.97); transition-duration: .1s; }
.opt:hover::before, .opt:focus-visible::before, .opt[aria-current="true"]::before { visibility: visible; }
.opt:focus-visible { outline: none; background: var(--hl); }
.opt:focus-visible::before { animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(-4px); } }
.opt.locked { color: var(--off); cursor: not-allowed; }
.opt[aria-pressed="true"] { color: var(--accent); }
#menu .opt, .row .opt { font-family: var(--display); font-size: 12px; line-height: 1.7; }

.files { display: flex; flex-direction: column; gap: 8px; }
.file { grid-template-columns: 18px minmax(0, 1fr) auto; padding-block: 9px; }
.file .no { color: var(--accent); font-variant-numeric: tabular-nums; }
.file .name { font-family: var(--display); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
.file .date { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.file .ttl { grid-column: 3 / -1; color: var(--dim); font-size: 15.5px; line-height: 1.45; overflow-wrap: anywhere; }
.file .tag { color: var(--accent); margin-right: 10px; }

/* an opened entry: translucent window that pops out over the screen */
#reader {
  position: fixed; inset: 0; z-index: 4; background: var(--veil);
  display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
#readerwin {
  width: min(100%, 720px); max-height: 100%; overflow-y: auto; padding: 22px 22px 20px;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--win-a) 84%, transparent), color-mix(in srgb, var(--win-b) 88%, transparent));
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  box-shadow: inset 0 0 0 2px var(--border-shade), 0 0 0 2px #000, 0 18px 50px rgba(0, 0, 0, .6);
}
#readerwin:focus { outline: none; }
#readerwin.pop { animation: pop .9s var(--spring); }
@keyframes pop { from { transform: translateY(20px) scale(.76); opacity: 0; } 55% { opacity: 1; } to { transform: none; opacity: 1; } }
.meta { color: var(--dim); font-size: 15px; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 0 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.filehead { border-bottom: 2px solid rgba(255, 255, 255, .3); padding-bottom: 14px; margin-bottom: 18px; }
.post { max-width: 62ch; display: flex; flex-direction: column; gap: 16px; font-family: var(--read); font-size: 20px; line-height: 1.6; text-shadow: 0 1px 1px rgba(0, 0, 0, .5); }
.post p, .post ul, .post blockquote { margin: 0; }
.post ul { padding-left: 1.4em; list-style: square; }
.post li::marker { color: var(--accent); }
.post blockquote { border-left: 3px solid var(--accent); padding-left: 18px; color: var(--fg); font-style: italic; font-size: 23px; line-height: 1.5; }
.eof { color: var(--dim); margin: 22px 0 8px; font-family: var(--display); font-size: 10px; letter-spacing: .1em; }
.shots { display: grid; gap: 10px; }
.shots.multi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
figure { margin: 0; min-width: 0; }
.shot { display: block; width: 100%; padding: 0; background: #000; border: 3px solid var(--border); border-radius: 6px; overflow: hidden; cursor: zoom-in; transition: transform .5s var(--spring); }
.shot:hover, .shot:focus-visible { transform: scale(1.02); outline: none; }
.shot img { display: block; width: 100%; height: auto; }
figcaption { color: var(--dim); font-size: 16px; font-style: italic; line-height: 1.4; margin-top: 6px; }
#zoom { position: fixed; inset: 0; z-index: 6; background: rgba(0, 0, 0, .92); cursor: zoom-out; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
#zoom img { max-width: 100%; max-height: calc(100% - 3em); min-height: 0; object-fit: contain; border: 3px solid var(--border); border-radius: 6px; }
#zoom p { margin: 0; color: var(--dim); text-align: center; }
.row { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.row .opt { width: auto; grid-template-columns: 18px auto; }
.group { margin-top: 20px; }
.sw { display: inline-block; width: 22px; height: 14px; border: 2px solid var(--border); border-radius: 3px; vertical-align: middle; margin-right: 8px; }
.sw i { display: block; width: 6px; height: 6px; margin: 2px 0 0 12px; }

/* motion: windows spring into place after the title screen; contents bounce in on every screen change */
@keyframes rise { from { translate: 0 22px; scale: .95; opacity: 0; } to { translate: 0 0; scale: 1; opacity: 1; } }
@keyframes slide { from { translate: -20px 0; opacity: 0; } to { translate: 0 0; opacity: 1; } }
@keyframes glint { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
@keyframes blink { 50% { opacity: .2; } }
.stage.go > .win { animation: rise 1.2s var(--spring) backwards; }
.stage.go > #help { animation-delay: .1s; } .stage.go > #main { animation-delay: .35s; } .stage.go > #menu { animation-delay: .6s; } .stage.go > #status { animation-delay: .85s; }
#main > *, #main .files > *, #main .group { animation: slide 1.1s var(--spring) backwards; animation-delay: calc(.25s + var(--i, 0) * 220ms); }
#help .site { animation: glint 3.2s ease-in-out infinite; }
#helptext::after { content: ""; display: inline-block; width: .5em; height: 1em; margin-left: 3px; vertical-align: text-bottom; background: var(--accent); opacity: 0; }
#helptext.typing::after { opacity: 1; }

/* title screen */
#intro {
  position: fixed; inset: 0; z-index: 5; background: var(--bg); cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 20px; transition: opacity .4s;
}
#intro.done { opacity: 0; pointer-events: none; }
#intro .win { width: min(100%, 440px); padding: 30px 20px 26px; text-align: center; animation: rise 1.2s var(--spring) backwards; }
#intro .name { font-family: var(--display); font-size: clamp(20px, 6.5vw, 30px); line-height: 1.5; color: var(--accent); }
#intro .tagline { color: var(--dim); margin-top: 8px; }
#intro .press { font-family: var(--display); font-size: 11px; line-height: 1.8; margin-top: 26px; animation: blink 1.6s ease-in-out infinite; }

/* phone view: the command window becomes a bar fixed to the bottom of the screen */
@media (max-width: 720px) {
  body { padding-bottom: 128px; }
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-areas: "help" "main" "status"; grid-template-rows: auto; }
  #menu {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; border-radius: 9px 9px 0 0;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 4px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  #menu .opt { grid-template-columns: 14px minmax(0, 1fr); gap: 0 4px; padding: 10px 4px; white-space: nowrap; font-size: 11px; }
  #menu .opt:hover, #menu .opt:focus-visible { transform: none; }
  #main { min-height: 0; padding: 16px 12px 20px; }
  .opt { padding-block: 9px; }
  .opt:hover, .opt:focus-visible { transform: translateX(3px); }
  .file { grid-template-columns: 18px minmax(0, 1fr); }
  .file .date { grid-column: 2; grid-row: 2; font-size: 14.5px; }
  h1 { font-size: 15px; } h2 { font-size: 14px; }
  #reader { padding: calc(8px + env(safe-area-inset-top, 0px)) 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
  #readerwin { padding: 18px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .opt:focus-visible::before, #readerwin.pop, .stage.go > .win, #main > *, #main .files > *, #main .group, #help .site, #intro .win, #intro .press { animation: none; }
  #intro, .opt { transition: none; }
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<div class="stage" id="stage">
  <div class="win" id="help">
    <span class="site">HALF LIFE</span>
    <span id="helptext" hidden></span>
    <span id="helpsr" role="status" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></span>
  </div>

  <main class="win" id="main" tabindex="-1"></main>

  <nav class="win" id="menu" aria-label="Commands">
    <button class="opt" type="button" id="m-files" data-help="Read log entries.">Log</button>
    <button class="opt locked" type="button" id="m-photos" data-locked="Not available yet." data-help="View photos. Not available yet.">Photos</button>
    <button class="opt locked" type="button" id="m-prints" data-locked="Not available yet." data-help="Buy prints. Not available yet.">Shop</button>
    <button class="opt" type="button" id="m-about" data-help="About this site.">About</button>
    <button class="opt" type="button" id="m-how" data-help="View controls.">Help</button>
  </nav>

  <dl class="win" id="status">
    <dt>Entries</dt><dd id="count">0</dd>
    <dt>Saved</dt><dd id="latest">-</dd>
    <dt>Time</dt><dd id="clock">--:--:--</dd>
  </dl>
</div>

<div id="reader" hidden><article class="win" id="readerwin" tabindex="-1" role="dialog" aria-modal="true" aria-label="Log entry"></article></div>

<div id="zoom" hidden><img alt=""><p></p></div>

<div id="intro"><div class="win">
  <div class="name">HALF LIFE</div>
  <div class="tagline">Still receiving.</div>
  <div class="press">Press any button</div>
</div></div>

<script>
/* ---------- CHRONICLES ----------
   Every blog post is one entry here. Body format:
   blank line = new paragraph, "## " = heading, "- " = list item, "> " = quote. */
const POSTS = [
  {
    file: "001_photo_test.log",
    date: "2026-10-03",
    tag: "SAMPLE",
    title: "Photo test",
    body: `[SAMPLE ENTRY. The pictures here are placeholders, not real photos. They show how photos sit inside a post.]

A photo goes on its own line between paragraphs. It fills the width of the text and takes a caption.

![One photo on its own line, with a caption](sample:1)

Put two or more photo lines together and they sit side by side. Select any photo to see it large.

![Left of a pair](sample:2)
![Right of a pair](sample:3)

Text carries on underneath as normal.`
  },
  {
    file: "000_start.log",
    date: "2026-10-02",
    tag: "SAMPLE",
    title: "First entry",
    body: `[SAMPLE ENTRY. Chris, rewrite or delete this one. It is here so you can see how a real post reads in the window.]

I nearly opened a Substack. It takes five minutes and it works.

But every Substack looks like every other Substack. A place I built myself can look like whatever I want, and what I want is for it to feel like opening a save file.

## What goes here

- Updates, whenever I have one. No schedule.
- Photos, once that menu unlocks.
- Prints for sale, eventually.

> Each post is a log entry. You opened one. That is the whole idea.

More soon.`
  }
];

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const sorted = POSTS.slice().sort((a, b) => b.date.localeCompare(a.date) || a.file.localeCompare(b.file));
const main = $("#main"), helptext = $("#helptext"), reader = $("#reader"), rwin = $("#readerwin");
let view = "files", viewHelp = "", soundOn = false, ac = null, current = null;

function setHash(h) { try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) {} }
let helpTimer = null, helpNow = "";
function help(text, bad) {
  helptext.classList.toggle("bad", !!bad);
  if (text === helpNow) return;
  helpNow = text; $("#helpsr").textContent = text; clearInterval(helpTimer);
  if (reduce) { helptext.textContent = text; return; }
  let i = 0; helptext.textContent = ""; helptext.classList.add("typing");
  helpTimer = setInterval(() => {
    i += 3; helptext.textContent = text.slice(0, i);
    if (i >= text.length) { clearInterval(helpTimer); helptext.classList.remove("typing"); }
  }, 16);
}
function blip(freq, len) { /* a soft, rounded click: a sine that drops in pitch, through a low-pass */
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter(), t = ac.currentTime;
    const f = 260 + freq * .3, d = (len || .05) + .03;
    o.type = "sine"; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * .55, t + d);
    lp.type = "lowpass"; lp.frequency.value = 1400;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.09, t + .004);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(lp); lp.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
function opt(text, helpText, onClick, cls) {
  const b = el("button", "opt" + (cls ? " " + cls : ""), text); b.type = "button";
  if (helpText) b.dataset.help = helpText;
  if (onClick) b.addEventListener("click", onClick);
  return b;
}
function mark(id) { document.querySelectorAll("#menu .opt").forEach((b) => b.setAttribute("aria-current", b.id === id ? "true" : "false")); }
function open(name, defaultHelp, menuId) { view = name; viewHelp = defaultHelp; main.textContent = ""; help(defaultHelp); mark(menuId); }

/* ---------- views ---------- */
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const day = (d) => { const [y, m, dd] = d.split("-"); return MONTHS[+m - 1] + " " + +dd + ", " + y; };
function showFiles(focusFirst) {
  open("files", "Select an entry.", "m-files");
  const list = el("div", "files");
  sorted.forEach((p) => {
    const b = opt(null, p.title, () => showPost(p), "file"); b.dataset.file = p.file;
    b.append(el("span", "name", p.title), el("span", "date", day(p.date)));
    b.style.setProperty("--i", list.children.length);
    list.append(b);
  });
  main.append(list);
  if (focusFirst) { const f = list.querySelector(".opt"); if (f) f.focus(); }
}

/* A photo line looks like  ![caption](address)  where the address is the photo's file.
   "sample:1" draws a placeholder picture so the layout can be seen before real photos exist. */
const PHOTO = /^!\[(.*)\]\((.+)\)$/;
function photoSrc(src) {
  const m = /^sample:(\d+)$/.exec(src); if (!m) return src;
  const n = +m[1], l = 30 + (n * 17) % 30;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(0,0%,' + (l + 40) + '%)"/><stop offset="1" stop-color="hsl(0,0%,' + l + '%)"/></linearGradient></defs>' +
    '<rect width="600" height="400" fill="url(#g)"/><circle cx="' + (110 + (n * 130) % 380) + '" cy="110" r="36" fill="rgba(255,255,255,.8)"/>' +
    '<path d="M0 300 L150 ' + (190 + n * 12) + ' L260 270 L400 ' + (210 - n * 10) + ' L600 290 V400 H0Z" fill="rgba(0,0,0,.45)"/>' +
    '<text x="300" y="374" text-anchor="middle" font-family="monospace" font-size="22" fill="#fff">SAMPLE PHOTO ' + n + '</text></svg>';
  return "data:image/svg+xml," + encodeURIComponent(svg);
}
function zoom(src, caption) { const z = $("#zoom"); z.querySelector("img").src = src; z.querySelector("img").alt = caption; z.querySelector("p").textContent = caption; z.hidden = false; }
function unzoom() { $("#zoom").hidden = true; }
function renderBody(text, into) {
  text.split(/\n\s*\n/).forEach((block) => {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lines.length) return;
    if (lines[0].startsWith("## ")) { into.append(el("h3", null, lines[0].slice(3))); lines.shift(); if (!lines.length) return; }
    if (lines.every((l) => PHOTO.test(l))) {
      const wrap = el("div", "shots" + (lines.length > 1 ? " multi" : ""));
      lines.forEach((l) => {
        const m = l.match(PHOTO), fig = el("figure"), b = el("button", "shot"), img = el("img");
        b.type = "button"; b.dataset.help = "View photo."; img.src = photoSrc(m[2]); img.alt = m[1]; img.loading = "lazy";
        b.append(img); b.addEventListener("click", () => zoom(img.src, m[1]));
        fig.append(b); if (m[1]) fig.append(el("figcaption", null, m[1])); wrap.append(fig);
      });
      into.append(wrap);
    } else if (lines.every((l) => l.startsWith("- "))) {
      const ul = el("ul"); lines.forEach((l) => ul.append(el("li", null, l.slice(2)))); into.append(ul);
    } else if (lines.every((l) => l.startsWith("> "))) {
      into.append(el("blockquote", null, lines.map((l) => l.slice(2)).join(" ")));
    } else into.append(el("p", null, lines.join(" ")));
  });
}

function showPost(p) {
  if (view !== "files") showFiles();
  current = p; setHash(p.file); help(p.title);
  rwin.textContent = "";
  const head = el("div", "filehead"), meta = el("p", "meta");
  meta.append(el("span", null, day(p.date)));
  head.append(meta, el("h2", null, p.title));
  const body = el("div", "post"); renderBody(p.body, body);
  const nav = el("div", "row group"), i = sorted.indexOf(p);
  nav.append(opt("Back", "Return to the log.", closePost));
  if (sorted[i + 1]) nav.append(opt("Next", "Next: " + sorted[i + 1].title, () => showPost(sorted[i + 1])));
  rwin.append(head, body, nav);
  reader.hidden = false; document.body.style.overflow = "hidden";
  rwin.classList.remove("pop"); void rwin.offsetWidth; rwin.classList.add("pop");
  rwin.scrollTop = 0; rwin.focus();
}
function closePost() {
  if (reader.hidden) return;
  reader.hidden = true; document.body.style.overflow = ""; setHash(""); help(viewHelp);
  const back = current && main.querySelector('[data-file="' + current.file + '"]');
  current = null; if (back) back.focus();
}
reader.addEventListener("click", (e) => { if (e.target === reader) closePost(); });

/* id, name, gradient top, gradient bottom, accent */
const COLOURS = [
  ["blackout", "Blackout", "#1c1c1c", "#000000", "#ffffff"],
  ["amethyst", "Amethyst", "#7434c8", "#1c0647", "#ffd95a"],
  ["twilight", "Twilight", "#8a3fd0", "#0b2a7a", "#8fe9ff"],
  ["sapphire", "Sapphire", "#2233b0", "#050a5e", "#ffd95a"],
  ["lagoon", "Lagoon", "#178a98", "#0a1f5c", "#ffe58a"],
  ["emerald", "Emerald", "#1c6a48", "#04200f", "#ffe58a"],
  ["moss", "Moss", "#5f7a22", "#0f2a1c", "#fff2b0"],
  ["ember", "Ember", "#c2591f", "#3d0a0a", "#fff0b8"],
  ["ruby", "Ruby", "#96213f", "#2a0512", "#ffd95a"],
  ["sunset", "Sunset", "#c2416b", "#3a1060", "#ffd95a"],
  ["rose", "Rose", "#b8478c", "#3a0a3a", "#bff3ff"],
  ["orchid", "Orchid", "#9a4fd6", "#5a0f4a", "#b8ffd9"],
  ["midnight", "Midnight", "#26306e", "#05050f", "#9fd0ff"],
  ["onyx", "Onyx", "#4a5266", "#12151c", "#ffd95a"],
  ["mono", "Parchment", "#7a6a4a", "#2a2014", "#ffe9b0"]
];
let winId = "blackout", sparkle = "#ffffff";
function setColour(c) {
  const t = COLOURS.find(([id]) => id === c) || COLOURS[0], r = document.documentElement.style;
  winId = t[0]; sparkle = t[4];
  r.setProperty("--win-a", t[2]); r.setProperty("--win-b", t[3]); r.setProperty("--accent", t[4]);
  store.set("win2", winId);
}
function showAbout() {
  open("about", "About this site.", "m-about");
  main.append(el("p", "label", "About"));
  const body = el("div", "post");
  renderBody(`Nothing stays as it is. Half Life is the name I give to that permanent state of change: always flowing, never clinging to one way.

> Half Life is not death, but what comes after it, an existence that lingers, unstable and eroding. It is a state where time runs backward, objects decay, and reality itself loses its certainty. You are still conscious, still moving, still wanting, but everything around you is thinning out. Memory fades, the present slips, and the future feels borrowed.`, body);
  const nav = el("div", "row group"); nav.append(opt("Back", "Return to the log.", () => showFiles(true)));
  main.append(body, nav);
}

function showControls() {
  open("controls", "View controls.", "m-how");
  main.append(el("p", "label", "Help"));
  const body = el("div", "post");
  renderBody(`## Touch or mouse

Select an entry to open it. Select Back, or tap outside the window, to close it.

## Keyboard

- Up / Down: move cursor
- Left / Right: switch window
- Enter: confirm
- Esc: cancel`, body);
  const nav = el("div", "row group"); nav.append(opt("Back", "Return to the log.", () => showFiles(true)));
  main.append(body, nav);
}

/* ---------- menu + input ---------- */
$("#m-files").addEventListener("click", () => showFiles(true));
$("#m-about").addEventListener("click", showAbout);
$("#zoom").addEventListener("click", unzoom);
$("#m-how").addEventListener("click", showControls);
document.querySelectorAll("#menu .locked").forEach((b) => b.addEventListener("click", () => { help(b.dataset.locked, true); blip(160, .16); }));

const helpFor = (t) => t.closest && t.closest("[data-help]");
document.addEventListener("focusin", (e) => { const o = helpFor(e.target); if (o) { help(o.dataset.help); blip(880, .04); } });
document.addEventListener("mouseover", (e) => { const o = helpFor(e.target); if (o) help(o.dataset.help); });
document.addEventListener("mouseout", (e) => { const o = helpFor(e.target); if (o && !o.contains(e.relatedTarget) && reader.hidden) help(viewHelp); });
document.addEventListener("click", (e) => { const o = e.target.closest && e.target.closest(".opt:not(.locked)"); if (o) blip(1320, .06); });

document.addEventListener("keydown", (e) => {
  if (!$("#intro").classList.contains("done")) { endIntro(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("#zoom").hidden) { if (e.key === "Escape" || e.key === "Enter" || e.key === " ") { unzoom(); e.preventDefault(); } return; }
  const reading = !reader.hidden;
  if (e.key === "Escape") { if (reading) { closePost(); blip(440); } else if (view !== "files") { showFiles(true); blip(440); } return; }
  const dir = { ArrowDown: 1, ArrowUp: -1 }[e.key];
  const side = e.key === "ArrowLeft" || e.key === "ArrowRight";
  if (!dir && !side) return;
  const a = document.activeElement;
  if (reading) {
    const opts = [...rwin.querySelectorAll(".opt")], i = opts.indexOf(a);
    if (side && opts.length) { opts[(Math.max(i, 0) + (e.key === "ArrowRight" ? 1 : -1) + opts.length) % opts.length].focus(); e.preventDefault(); }
    return; /* Up and Down scroll the entry */
  }
  const inMenu = $("#menu").contains(a), inMain = main.contains(a) && a !== main;
  let pane = inMenu ? $("#menu") : main;
  if (side) pane = (e.key === "ArrowRight" && !inMenu) ? $("#menu") : (e.key === "ArrowLeft" && inMenu) ? main : null;
  if (!pane) return;
  const opts = [...pane.querySelectorAll(".opt")]; if (!opts.length) return;
  let i = opts.indexOf(a);
  if (side || (!inMenu && !inMain)) i = Math.max(0, opts.findIndex((o) => o.getAttribute("aria-current") === "true"));
  else i = (i + dir + opts.length) % opts.length;
  opts[i].focus(); e.preventDefault();
});

/* ---------- intro ---------- */
function assemble() { const st = $("#stage"); st.classList.remove("go"); void st.offsetWidth; st.classList.add("go"); }
function endIntro() {
  if ($("#intro").classList.contains("done")) return;
  $("#intro").classList.add("done"); try { sessionStorage.setItem("intro", "1"); } catch (e) {}
  blip(1320, .08); assemble(); if (reader.hidden && view === "files") showFiles();
}
function intro(force) {
  let seen = false; try { seen = sessionStorage.getItem("intro") === "1"; } catch (e) {}
  if (!force && seen) { $("#intro").classList.add("done"); assemble(); return; }
  $("#intro").classList.remove("done");
}
$("#intro").addEventListener("click", endIntro);

/* ---------- drifting sparkles ---------- */
const sky = $("#sky"), sx = sky.getContext("2d");
let motes = [];
function sizeSky() {
  sky.width = window.innerWidth; sky.height = window.innerHeight;
  const n = Math.round(Math.min(90, sky.width * sky.height / 14000));
  motes = Array.from({ length: n }, () => ({ x: Math.random() * sky.width, y: Math.random() * sky.height,
    s: Math.random() < .25 ? 3 : 2, v: .12 + Math.random() * .35, p: Math.random() * 6.28, gold: Math.random() < .35 }));
  drawSky(0);
}
function drawSky(step) { /* pixel sparkles that float up and sway */
  sx.clearRect(0, 0, sky.width, sky.height);
  for (const m of motes) {
    m.y -= m.v * step; m.p += .02 * step; m.x += Math.sin(m.p) * .25 * step;
    if (m.y < -4) { m.y = sky.height + 4; m.x = Math.random() * sky.width; }
    sx.globalAlpha = .25 + .55 * (.5 + .5 * Math.sin(m.p * 2));
    sx.fillStyle = m.gold ? sparkle : "#ffffff";
    sx.fillRect(Math.round(m.x), Math.round(m.y), m.s, m.s);
  }
  sx.globalAlpha = 1;
}
window.addEventListener("resize", sizeSky);

/* ---------- start ---------- */
$("#count").textContent = sorted.length;
$("#latest").textContent = sorted[0] ? day(sorted[0].date).split(",")[0] : "-";
const tick = () => { $("#clock").textContent = new Date().toTimeString().slice(0, 8); };
tick(); setInterval(tick, 1000);
setColour("blackout");
sizeSky();
if (!reduce) (function loop() { if (!document.hidden) drawSky(1); requestAnimationFrame(loop); })();
showFiles();
const start = decodeURIComponent((location.hash || "").slice(1));
const linked = start && sorted.find((p) => p.file === start);
if (linked) { $("#intro").classList.add("done"); assemble(); showPost(linked); } else intro(false);
</script>
</body>
