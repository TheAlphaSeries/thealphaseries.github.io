<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<link rel="stylesheet" href="site/site.css">

<canvas id="sky" aria-hidden="true"></canvas>

<div class="stage" id="stage">
  <div class="win" id="titlebar"><span class="site">HALF LIFE</span><span id="helpline" aria-live="off"></span></div>

  <main class="win" id="main" tabindex="-1"></main>

  <nav class="win" id="menu" aria-label="Commands">
    <button class="opt" type="button" id="m-files">Log</button>
    <button class="opt" type="button" id="m-quests">Quests</button>
    <button class="opt" type="button" id="m-chron">Chronicle</button>
    <button class="opt" type="button" id="m-bestiary">Bestiary</button>
    <button class="opt" type="button" id="m-plants">Herbarium</button>
    <button class="opt" type="button" id="m-photos">Photos</button>
    <button class="opt" type="button" id="m-map">Map</button>
    <button class="opt" type="button" id="m-status">Status</button>
    <button class="opt" type="button" id="m-gear">Equipment</button>
    <button class="opt locked" type="button" id="m-prints" disabled>Shop</button>
    <button class="opt" type="button" id="m-about">About</button>
    <button class="opt" type="button" id="m-how">Help</button>
    <button class="opt" type="button" id="m-music" aria-pressed="true">Music Off</button>
  </nav>

  <dl class="win" id="status">
    <dt>Level</dt><dd id="lvl">-</dd>
    <dt>Entries</dt><dd id="count">0</dd>
    <dt>Saved</dt><dd id="latest">-</dd>
    <dt>Complete</dt><dd id="pct">-</dd>
    <dt>Time</dt><dd id="clock">--:--:--</dd>
  </dl>

  <button class="win" id="minimap" type="button" aria-label="Open the map"><canvas aria-hidden="true"></canvas><span>Map</span></button>
</div>

<div id="reader" hidden><article class="win" id="readerwin" tabindex="-1" role="dialog" aria-modal="true" aria-label="Log entry"></article></div>

<div id="zoom" hidden>
  <img alt="">
  <p></p>
  <div class="zoomnav" hidden><button type="button" id="zprev" aria-label="Previous photo">Prev</button><span id="zcount"></span><button type="button" id="znext" aria-label="Next photo">Next</button></div>
</div>

<div id="moments" aria-live="polite"></div>
<div id="intro"><div class="titlewrap">
  <canvas id="sprite" width="180" height="232" aria-hidden="true"></canvas>
  <div class="win">
  <div class="name">HALF LIFE</div>
  <div class="tagline">Still receiving.</div>
  <button class="opt start" id="startbtn" type="button">Start</button>
  <button class="opt start" id="continuebtn" type="button" hidden></button>
  </div>
</div></div>

<!-- The page is drawn by the scripts in site/, read in this order (site/README.md says what each does). figures.js draws the companions. -->
<script src="figures.js"></script>
<script src="site/01-content.js"></script>
<script src="site/02-home.js"></script>
<script src="site/03-bestiary.js"></script>
<script src="site/04-text.js"></script>
<script src="site/05-popout.js"></script>
<script src="site/06-photos.js"></script>
<script src="site/07-map.js"></script>
<script src="site/08-status.js"></script>
<script src="site/09-menu.js"></script>
<script src="site/10-figure.js"></script>
<script src="site/11-sky.js"></script>
<script src="site/12-music.js"></script>
<script src="site/13-moments.js"></script>
<script src="site/14-touches.js"></script>
<script src="site/15-sayings.js"></script>
<script src="site/16-fishing.js"></script>
<script src="site/17-start.js"></script>
</body>
</html>
