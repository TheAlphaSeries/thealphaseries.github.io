<body>
<style>
/* Layout: a 16-bit RPG menu screen. Title bar across the top, a large main window
   (log list / About / Help), a command window and a status window on the right.
   A title screen with a Start button covers it first; an opened entry pops out as a
   translucent window. Single black look by choice. */
:root {
  color-scheme: dark;
  --win-a: #1c1c1c;       /* window gradient, top */
  --win-b: #000000;       /* window gradient, bottom */
  --accent: #ffffff;      /* cursor, headings */
  --bg: color-mix(in srgb, var(--win-b) 28%, #000);            /* field behind the windows */
  --veil: color-mix(in srgb, var(--bg) 62%, transparent);
  --border: #f6f2ff;                                            /* window frame */
  --border-shade: color-mix(in srgb, var(--win-a) 45%, #c4c4cc);/* inner frame line */
  --fg: #ffffff;
  --dim: color-mix(in srgb, var(--win-a) 22%, #fff);            /* dates, captions */
  --off: color-mix(in srgb, var(--win-a) 48%, #fff);            /* unavailable commands */
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --display: "Press Start 2P", "Courier New", monospace;
  --body: "DotGothic16", ui-monospace, Menlo, monospace;
  --read: "Newsreader", Georgia, "Times New Roman", serif;   /* long-form reading text */
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 17px; line-height: 1.7;
  padding-inline: 16px; padding-block: 20px 32px;
  text-shadow: 1px 1px 0 rgba(0, 0, 0, .7);
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.stage {
  position: relative; z-index: 1;
  max-width: 960px; margin-inline: auto;
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr) 220px;
  grid-template-areas: "help help" "main menu" "main status";
  grid-template-rows: auto auto 1fr;
}
.win {
  background: linear-gradient(to bottom, var(--win-a), var(--win-b));
  border: 3px solid var(--border); border-radius: 9px;
  box-shadow: inset 0 0 0 2px var(--border-shade), 0 0 0 2px #000;
  padding: 14px 16px; min-width: 0;
}
#titlebar { grid-area: help; }
#titlebar .site { font-family: var(--display); font-size: 13px; line-height: 1.6; color: var(--accent); }
#main { grid-area: main; min-height: 440px; padding: 20px 20px 22px; }
#menu { grid-area: menu; display: flex; flex-direction: column; gap: 4px; }
#status { grid-area: status; align-self: start; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-variant-numeric: tabular-nums; }
#status dt { color: var(--dim); } #status dd { margin: 0; text-align: right; }
dl { margin: 0; }

h2, h3, .label { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; line-height: 1.6; }
h3 { font-size: 12px; line-height: 1.7; color: var(--accent); margin-top: 8px; }
.label { color: var(--accent); font-size: 12px; line-height: 1.6; letter-spacing: .06em; margin-bottom: 14px; }

/* a selectable option: the cursor appears on hover / focus, and the row leans out on a soft spring */
.opt {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 0 6px; align-items: baseline;
  width: 100%; padding: 6px 4px; text-align: left;
  background: none; border: 0; border-radius: 4px; color: inherit; font: inherit; text-shadow: inherit; cursor: pointer;
  transition: transform .5s var(--spring);
}
.opt::before {
  content: ""; width: 0; height: 0; align-self: center; visibility: hidden;
  border-left: 10px solid var(--accent); border-top: 6px solid transparent; border-bottom: 6px solid transparent;
  filter: drop-shadow(1px 1px 0 rgba(0, 0, 0, .7));
}
.opt:hover, .opt:focus-visible { transform: translateX(6px); }
.opt:active { transform: translateX(2px) scale(.97); transition-duration: .1s; }
.opt:hover::before, .opt:focus-visible::before, .opt[aria-current="true"]::before { visibility: visible; }
.opt:focus-visible { outline: none; }
.opt:focus-visible::before { animation: nudge 1.1s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(-4px); } }
.opt.locked { color: var(--off); cursor: default; pointer-events: none; }   /* greyed out: cannot be pointed at, selected or pressed */
.opt[aria-pressed="true"] { color: var(--accent); }
#menu .opt, .row .opt { font-family: var(--display); font-size: 12px; line-height: 1.7; }

.tally { color: var(--dim); margin: -6px 0 14px 24px; font-variant-numeric: tabular-nums; }
.beasts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
.beastlist { display: flex; flex-direction: column; gap: 4px; }
.beast { grid-template-columns: 18px 3ch minmax(0, 1fr) auto; }
.beast .num { color: var(--dim); font-variant-numeric: tabular-nums; }
.beast .name { font-family: var(--display); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
.beast .qty { color: var(--dim); font-variant-numeric: tabular-nums; }
.beast[aria-pressed="true"]::before { visibility: visible; }
.beastcard { border: 3px solid var(--border); border-radius: 9px; box-shadow: inset 0 0 0 2px var(--border-shade); padding: 14px 16px 16px; min-width: 0; }
.beastcard.pop { animation: pop .5s var(--spring); }
.fishpic { display: block; width: 100%; max-width: 228px; height: auto; margin: 0 auto 10px; image-rendering: pixelated; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 10px 0 0; }
.facts dt { color: var(--dim); } .facts dd { margin: 0; }
.note { margin: 10px 0 0; font-family: var(--read); font-size: 19px; font-style: italic; line-height: 1.45; text-shadow: 0 1px 1px rgba(0, 0, 0, .5); }
.files { display: flex; flex-direction: column; gap: 8px; }
.file { grid-template-columns: 18px minmax(0, 1fr) auto; padding-block: 9px; }
.file.chosen { animation: chosen .12s steps(1) 2; }
@keyframes chosen { 50% { opacity: .2; } }
.file .name { font-family: var(--display); font-size: 12px; line-height: 1.8; overflow-wrap: anywhere; }
.file .date { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* an opened entry: translucent window that pops out over the screen */
#reader {
  position: fixed; inset: 0; z-index: 4; background: color-mix(in srgb, var(--bg) 30%, transparent);
  display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
#readerwin {
  width: min(100%, 720px); max-height: 100%; overflow-y: auto; padding: 22px 22px 20px;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--win-a) 66%, transparent), color-mix(in srgb, var(--win-b) 72%, transparent));   /* see-through: the log shows faintly behind */
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  box-shadow: inset 0 0 0 2px var(--border-shade), 0 0 0 2px #000, 0 18px 50px rgba(0, 0, 0, .6);
}
#readerwin:focus { outline: none; }
#readerwin.pop { animation: pop .9s var(--spring); }
@keyframes pop { from { transform: translateY(20px) scale(.76); opacity: 0; } 55% { opacity: 1; } to { transform: none; opacity: 1; } }
.meta { color: var(--dim); font-size: 15px; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 0 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.filehead { border-bottom: 2px solid rgba(255, 255, 255, .3); padding-bottom: 14px; margin-bottom: 18px; }
.post { max-width: 62ch; display: flex; flex-direction: column; gap: 16px; font-family: var(--read); font-size: 20px; line-height: 1.6; text-shadow: 0 1px 1px rgba(0, 0, 0, .5); }
.post p, .post ul, .post ol, .post blockquote { margin: 0; }
.post ul { padding-left: 1.4em; list-style: square; }
.post ol { padding-left: 1.6em; }
.post li::marker { color: var(--accent); }
.post a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.post code { font-family: var(--body); font-size: .85em; }
.post hr { width: 100%; border: 0; border-top: 2px solid rgba(255, 255, 255, .3); margin: 6px 0; }
.sub { color: var(--dim); margin: 14px 0 0 24px; }
.post blockquote { border-left: 3px solid var(--accent); padding-left: 18px; color: var(--fg); font-style: italic; font-size: 23px; line-height: 1.5; }
.shots { display: grid; gap: 10px; }
.shots.multi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
figure { margin: 0; min-width: 0; }
.shot { display: block; width: 100%; padding: 0; background: #000; border: 3px solid var(--border); border-radius: 6px; overflow: hidden; cursor: zoom-in; transition: transform .5s var(--spring); }
.shot:hover, .shot:focus-visible { transform: scale(1.02); outline: none; }
.shot img { display: block; width: 100%; height: auto; }
figcaption { color: var(--dim); font-size: 16px; font-style: italic; line-height: 1.4; margin-top: 6px; }
#zoom { position: fixed; inset: 0; z-index: 6; background: rgba(0, 0, 0, .92); cursor: zoom-out; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
#zoom img { max-width: 100%; max-height: calc(100% - 3em); min-height: 0; object-fit: contain; border: 3px solid var(--border); border-radius: 6px; }
#zoom p { margin: 0; color: var(--dim); text-align: center; }
.row { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.row .opt { width: auto; grid-template-columns: 18px auto; }
.group { margin-top: 20px; }

/* motion: windows spring into place after the title screen; contents bounce in on every screen change */
@keyframes rise { from { translate: 0 22px; scale: .95; opacity: 0; } to { translate: 0 0; scale: 1; opacity: 1; } }
@keyframes slide { from { translate: -20px 0; opacity: 0; } to { translate: 0 0; opacity: 1; } }
@keyframes glint { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
.stage.go > .win { animation: rise 1.2s var(--spring) backwards; }
.stage.go > #titlebar { animation-delay: .1s; } .stage.go > #main { animation-delay: .35s; } .stage.go > #menu { animation-delay: .6s; } .stage.go > #status { animation-delay: .85s; }
#main > *, #main .files > *, #main .group { animation: slide 1.1s var(--spring) backwards; animation-delay: calc(.25s + var(--i, 0) * 220ms); }
#titlebar .site { animation: glint 3.2s ease-in-out infinite; }

/* title screen */
#intro {
  position: fixed; inset: 0; z-index: 5; background: var(--bg); cursor: pointer;
  display: flex; align-items: center; justify-content: center; padding: 20px; transition: opacity .4s;
}
#intro.done { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
#intro .titlewrap { position: relative; width: min(100%, 440px); }
/* the sprite stands behind the title box and springs up to wave over its top edge */
#sprite { position: absolute; right: 12%; bottom: 100%; width: 96px; height: auto; image-rendering: pixelated; z-index: 0;
  transform: translateY(102%); transition: transform .9s var(--spring); }
#sprite.up { transform: translateY(20%); }
#intro .win { position: relative; z-index: 1; width: 100%; padding: 30px 20px 26px; text-align: center; animation: rise 1.2s var(--spring) backwards; }
#intro .name { font-family: var(--display); font-size: clamp(20px, 6.5vw, 30px); line-height: 1.5; color: var(--accent); }
#intro .tagline { color: var(--dim); margin-top: 8px; }
#intro .start { width: auto; margin: 24px auto 0; grid-template-columns: 18px auto; padding: 10px 16px 10px 10px; font-family: var(--display); font-size: 13px; line-height: 1.7; }
#intro .start::before { visibility: visible; animation: nudge 1.1s ease-in-out infinite; }

/* phone view: the command window becomes a bar fixed to the bottom of the screen */
@media (max-width: 720px) {
  body { padding-bottom: 170px; }
  .beasts { grid-template-columns: minmax(0, 1fr); }
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-areas: "help" "main" "status"; grid-template-rows: auto; }
  #menu {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; border-radius: 9px 9px 0 0;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 4px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  #menu .opt { grid-template-columns: 14px minmax(0, 1fr); gap: 0 4px; padding: 10px 4px; white-space: nowrap; font-size: 11px; }
  #menu .opt:hover, #menu .opt:focus-visible { transform: none; }
  #main { min-height: 0; padding: 16px 12px 20px; }
  .opt { padding-block: 9px; }
  .opt:hover, .opt:focus-visible { transform: translateX(3px); }
  .file { grid-template-columns: 18px minmax(0, 1fr); }
  .file .date { grid-column: 2; grid-row: 2; font-size: 14.5px; }
  h2 { font-size: 14px; }
  #reader { padding: calc(8px + env(safe-area-inset-top, 0px)) 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
  #readerwin { padding: 18px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .opt:focus-visible::before, .file.chosen, .beastcard.pop, #readerwin.pop, .stage.go > .win, #main > *, #main .files > *, #main .group, #titlebar .site, #intro .win, #intro .start::before { animation: none; }
  #intro, .opt, #sprite { transition: none; }
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<div class="stage" id="stage">
  <div class="win" id="titlebar"><span class="site">HALF LIFE</span></div>

  <main class="win" id="main" tabindex="-1"></main>

  <nav class="win" id="menu" aria-label="Commands">
    <button class="opt" type="button" id="m-files">Log</button>
    <button class="opt" type="button" id="m-bestiary">Bestiary</button>
    <button class="opt locked" type="button" id="m-photos" disabled>Photos</button>
    <button class="opt locked" type="button" id="m-prints" disabled>Shop</button>
    <button class="opt" type="button" id="m-about">About</button>
    <button class="opt" type="button" id="m-how">Help</button>
    <button class="opt" type="button" id="m-music" aria-pressed="true">Music Off</button>
  </nav>

  <dl class="win" id="status">
    <dt>Entries</dt><dd id="count">0</dd>
    <dt>Saved</dt><dd id="latest">-</dd>
    <dt>Time</dt><dd id="clock">--:--:--</dd>
  </dl>
</div>

<div id="reader" hidden><article class="win" id="readerwin" tabindex="-1" role="dialog" aria-modal="true" aria-label="Log entry"></article></div>

<div id="zoom" hidden><img alt=""><p></p></div>

<div id="intro"><div class="titlewrap">
  <canvas id="sprite" width="24" height="32" aria-hidden="true"></canvas>
  <div class="win">
  <div class="name">HALF LIFE</div>
  <div class="tagline">Still receiving.</div>
  <button class="opt start" id="startbtn" type="button">Start</button>
  </div>
</div></div>

<script>
/* ==========================================================================
   1. LOG ENTRIES
   Entries are not written in this file. Each one is its own file in the
   posts/ folder (made with the editor at app.pagescms.org), photos live in
   photos/, and the About text is pages/about.md. scripts/build-index.mjs
   gathers them into posts.json, which this page loads when it opens.
   ========================================================================== */
let ABOUT = "";          /* the About text, loaded from posts.json */
let BESTIARY = [];       /* the creatures, loaded from posts.json */
let sorted = [];         /* the entries, newest first, loaded from posts.json */
let loadNote = "Loading...";   /* shown in the log while there is nothing to list */
const HELP = `## Touch or mouse

Select an entry to open it. Select Back, or tap outside the window, to close it.

## Keyboard

- Up / Down: move cursor
- Left / Right: switch window
- Enter: confirm
- Esc: cancel`;

/* ==========================================================================
   2. HELPERS
   ========================================================================== */
const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = {   /* the visitor's saved choices; storage can be blocked, so never let it throw */
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const day = (d) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? MONTHS[+m[2] - 1] + " " + +m[3] + ", " + m[1] : ""; };

const stage = $("#stage"), main = $("#main"), menu = $("#menu"), reader = $("#reader"), rwin = $("#readerwin"), zoomBox = $("#zoom"), introBox = $("#intro");
let view = "files";      /* which screen the main window shows: files, bestiary, about or help */
let current = null;      /* the entry open in the pop-out window, if any */

function setHash(h) { try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) {} }
function opt(text, onClick, cls) {   /* a selectable menu option */
  const b = el("button", "opt" + (cls ? " " + cls : ""), text); b.type = "button";
  if (onClick) b.addEventListener("click", onClick);
  return b;
}
/* Anything layered on top (title screen, open entry, enlarged photo) makes the menu behind it unreachable. */
function syncLayers() { stage.inert = !introBox.classList.contains("done") || !reader.hidden || !zoomBox.hidden; }

/* ==========================================================================
   3. SCREENS
   ========================================================================== */
function openScreen(name, menuId) {
  view = name; main.textContent = "";
  menu.querySelectorAll(".opt").forEach((b) => { if (b.id !== "m-music") b.setAttribute("aria-current", String(b.id === menuId)); });
}
function backRow() { const nav = el("div", "row group"); nav.append(opt("Back", () => showFiles(true))); return nav; }

function showFiles(focusFirst) {
  openScreen("files", "m-files");
  const list = el("div", "files");
  sorted.forEach((p, i) => {
    const b = opt(null, () => {   /* flash the chosen row, then open it */
      if (reduceMotion) return showPost(p);
      b.classList.add("chosen"); setTimeout(() => { b.classList.remove("chosen"); showPost(p); }, 250);
    }, "file"); b.dataset.file = p.file;
    b.append(el("span", "name", p.title), el("span", "date", day(p.date)));
    b.style.setProperty("--i", i);
    list.append(b);
  });
  main.append(list);
  if (!sorted.length) main.append(el("p", "sub", loadNote));
  if (focusFirst) { const f = list.querySelector(".opt"); if (f) f.focus(); }
}
function showPage(name, menuId, label, text) {
  openScreen(name, menuId);
  const body = el("div", "post"); renderBody(text, body);
  main.append(el("p", "label", label), body, backRow());
}

/* ----- the bestiary: a list of creatures on the left, the chosen one's details on the right ----- */

/* ----- entry text -----
   Entries are written in Markdown, which is what the editor saves: blank line = new paragraph,
   # heading, - or 1. lists, > quote, **bold**, *italic*, [link](address), ![caption](photo).
   Everything is built as page elements, never pasted in as raw HTML. */
const IMG = /!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/;
const INLINE = /\\([\\`*_\[\]()!#>.+-])|!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)|\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)|\*\*(.+?)\*\*|__(.+?)__|\*([^*\s][^*]*)\*|(?<![A-Za-z0-9])_([^_\s][^_]*)_(?![A-Za-z0-9])|`([^`]+)`/;
const safeUrl = (u) => (/^(https?:|mailto:|\/|\.\/|#)/i.test(u) || !/^[a-z][a-z0-9+.-]*:/i.test(u)) ? u : "#";
function photo(src, caption) {
  const fig = el("figure"), b = el("button", "shot"), img = el("img");
  b.type = "button"; b.setAttribute("aria-label", "Enlarge photo" + (caption ? ": " + caption : ""));
  img.src = safeUrl(src); img.alt = caption || ""; img.loading = "lazy";
  b.append(img); b.addEventListener("click", () => zoom(img.src, caption || "", b));
  fig.append(b); if (caption) fig.append(el("figcaption", null, caption));
  return fig;
}
function inline(text, into) {   /* bold, italic, links and code inside a line */
  const re = new RegExp(INLINE.source, "g");
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) into.append(text.slice(last, m.index));
    if (m[1]) into.append(m[1]);
    else if (m[3]) into.append(photo(m[3], m[2]));
    else if (m[5]) { const a = el("a"); inline(m[4], a); a.href = safeUrl(m[5]); a.target = "_blank"; a.rel = "noopener"; into.append(a); }
    else if (m[6] || m[7]) { const b = el("strong"); inline(m[6] || m[7], b); into.append(b); }
    else if (m[8] || m[9]) { const i = el("em"); inline(m[8] || m[9], i); into.append(i); }
    else if (m[10]) into.append(el("code", null, m[10]));
    last = re.lastIndex;
  }
  if (last < text.length) into.append(text.slice(last));
}
function renderBody(text, into) {
  String(text || "").replace(/\r/g, "").split(/\n\s*\n/).forEach((block) => {
    let lines = block.split("\n").map((l) => l.trimEnd()).filter((l) => l.trim());
    if (!lines.length) return;
    const head = /^\s*#{1,6}\s+(.*)$/.exec(lines[0]);
    if (head) { const h = el("h3"); inline(head[1].replace(/\s+#+\s*$/, ""), h); into.append(h); lines = lines.slice(1); if (!lines.length) return; }
    const flat = lines.map((l) => l.trim());
    if (flat.length === 1 && /^(-{3,}|\*{3,}|_{3,})$/.test(flat[0])) { into.append(el("hr")); return; }
    const joined = flat.join(" ");
    if (joined.replace(new RegExp(IMG.source, "g"), "").trim() === "") {   /* nothing but photos: lay them out as a set */
      const shots = [...joined.matchAll(new RegExp(IMG.source, "g"))];
      const wrap = el("div", "shots" + (shots.length > 1 ? " multi" : ""));
      shots.forEach((m) => wrap.append(photo(m[2], m[1])));
      into.append(wrap); return;
    }
    const bullet = /^[-*+]\s+/, number = /^\d+[.)]\s+/;
    if (bullet.test(flat[0]) || number.test(flat[0])) {
      const marker = bullet.test(flat[0]) ? bullet : number, list = el(marker === bullet ? "ul" : "ol");
      let li = null;
      flat.forEach((l) => {
        if (marker.test(l)) { li = el("li"); inline(l.replace(marker, ""), li); list.append(li); }
        else if (li) { li.append(" "); inline(l, li); }
      });
      into.append(list); return;
    }
    if (flat.every((l) => l.startsWith(">"))) {
      const q = el("blockquote"); inline(flat.map((l) => l.replace(/^>\s?/, "")).join(" "), q); into.append(q); return;
    }
    const para = el("p");
    lines.forEach((l, i) => {   /* a line ending in two spaces or a backslash is a deliberate line break */
      const hard = /( {2,}|\\)$/.test(l);
      inline(l.replace(/( {2,}|\\)$/, "").trim(), para);
      if (i < lines.length - 1) para.append(hard ? el("br") : " ");
    });
    into.append(para);
  });
}

/* ----- the pop-out entry window ----- */
function showPost(p) {
  if (view !== "files") showFiles();
  current = p; setHash(p.file);

  meta.append(el("span", null, day(p.date)));
  head.append(meta, el("h2", null, p.title));
  const body = el("div", "post"); renderBody(p.body, body);
  const nav = el("div", "row group"), next = sorted[sorted.indexOf(p) + 1];
  nav.append(opt("Back", closePost));
  if (next) nav.append(opt("Next", () => showPost(next)));
  rwin.append(head, body, nav);
  reader.hidden = false; document.body.style.overflow = "hidden"; syncLayers();
  rwin.classList.remove("pop"); void rwin.offsetWidth; rwin.classList.add("pop");
  rwin.scrollTop = 0; rwin.focus();
}
function closePost() {
  if (reader.hidden) return;
  reader.hidden = true; document.body.style.overflow = ""; setHash(""); syncLayers();
  const back = current && main.querySelector('[data-file="' + current.file + '"]');
  current = null; if (back) back.focus();

document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!introBox.classList.contains("done")) {   /* title screen: Enter or Space starts */
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); endIntro(); }
    return;
  }
  if (!zoomBox.hidden) { if (e.key === "Escape" || e.key === "Enter" || e.key === " ") { e.preventDefault(); unzoom(); } return; }
  const reading = !reader.hidden;
  if (e.key === "Escape") { if (reading) closePost(); else if (view !== "files") showFiles(true); return; }
  const dir = { ArrowDown: 1, ArrowUp: -1 }[e.key];
  const side = e.key === "ArrowLeft" || e.key === "ArrowRight";
  if (!dir && !side) return;
  const a = document.activeElement;
  if (reading) {   /* Left and Right move between Back and Next; Up and Down scroll the entry */
    const opts = [...rwin.querySelectorAll(".opt")], i = opts.indexOf(a);
    if (side && opts.length) { opts[(Math.max(i, 0) + (e.key === "ArrowRight" ? 1 : -1) + opts.length) % opts.length].focus(); e.preventDefault(); }
    return;
  }
  const inMenu = menu.contains(a), inMain = main.contains(a) && a !== main;
  let pane = inMenu ? menu : main;
  if (side) pane = (e.key === "ArrowRight" && !inMenu) ? menu : (e.key === "ArrowLeft" && inMenu) ? main : null;
  if (!pane) return;
  const opts = [...pane.querySelectorAll(".opt:not(.locked)")]; if (!opts.length) return;
  let i = opts.indexOf(a);
  if (side || (!inMenu && !inMain)) i = Math.max(0, opts.findIndex((o) => o.getAttribute("aria-current") === "true"));
  else i = (i + dir + opts.length) % opts.length;
  opts[i].focus(); e.preventDefault();
});

/* ==========================================================================
   6. DRIFTING SPARKLES (background)
   ========================================================================== */
const sky = $("#sky"), sx = sky.getContext("2d");
let motes = [];
function sizeSky() {
  sky.width = window.innerWidth; sky.height = window.innerHeight;
  const n = Math.round(Math.min(90, sky.width * sky.height / 14000));
  motes = Array.from({ length: n }, () => ({ x: Math.random() * sky.width, y: Math.random() * sky.height,
    s: Math.random() < .25 ? 3 : 2, v: .12 + Math.random() * .35, p: Math.random() * 6.28 }));
  drawSky(0);
}
function drawSky(step) {
  sx.clearRect(0, 0, sky.width, sky.height); sx.fillStyle = "#ffffff";
  for (const m of motes) {
    m.y -= m.v * step; m.p += .02 * step; m.x += Math.sin(m.p) * .25 * step;
    if (m.y < -4) { m.y = sky.height + 4; m.x = Math.random() * sky.width; }
    sx.globalAlpha = .25 + .55 * (.5 + .5 * Math.sin(m.p * 2));
    sx.fillRect(Math.round(m.x), Math.round(m.y), m.s, m.s);
  }
  sx.globalAlpha = 1;
}
window.addEventListener("resize", sizeSky);

   An original looping piece made in the browser (no audio file): a slow
   melody over a drone and a hand drum. On unless the visitor turned it off.
   Browsers only allow sound to start from inside a tap, click or key press,
   so the audio engine is created there (unlockAudio), never at page load.
   ========================================================================== */
const MELODY = [[62, 0, 66, 67, 69, 0, 67, 66], [63, 0, 62, 0, 0, 0, 57, 0], [62, 0, 66, 67, 69, 0, 70, 69], [67, 0, 66, 0, 63, 0, 62, 0],
                [74, 0, 72, 70, 69, 0, 70, 0], [69, 0, 67, 66, 67, 0, 63, 0], [62, 63, 66, 0, 67, 66, 63, 0], [62, 0, 0, 0, 0, 0, 0, 0]];   /* 8 bars of 8 steps; 0 = rest */
const STEP = 0.31;   /* seconds per step */
const AudioEngine = window.AudioContext || window.webkitAudioContext;
let musicOn = store.get("music3") !== "0";
let ac = null, bus = null, musicTimer = null, nextNote = 0, stepNo = 0;
let audioError = "", unlockedBy = "";   /* kept for the ?debug readout */

function note(midi, t, len, vol, type) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + len + 0.05);
}
function drum(t, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.14);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.25);
}
function playStep(bar, s, t) {
  const n = MELODY[bar][s];
  if (n) { note(n, t, 1.3, 0.06, "triangle"); note(n + 12, t, 0.5, 0.012, "sine"); }
  if (s === 0) { note(38, t, 2.6, 0.09, "sine"); note(50, t, 2.6, 0.03, "triangle"); }   /* drone */
  if (s === 4) note(45, t, 1.4, 0.045, "sine");
  if (s === 0 || s === 3 || s === 6) drum(t, s === 0 ? 0.11 : 0.06);
}
function schedule() {   /* queue the next fraction of a second of notes; runs ten times a second */
  if (!ac || ac.state !== "running" || !musicOn || document.hidden) { nextNote = 0; return; }
  try {
    if (nextNote < ac.currentTime) nextNote = ac.currentTime + 0.06;
    while (nextNote < ac.currentTime + 0.4) {
      playStep(Math.floor(stepNo / 8) % MELODY.length, stepNo % 8, nextNote);
      nextNote += STEP; stepNo++;
    }
  } catch (err) { audioError = "schedule: " + err; }
}
function syncMusic() {   /* make the button and the sound match musicOn; safe to call at any time */
  const b = $("#m-music");
  b.textContent = musicOn ? "Music Off" : "Music On";   /* the button names what choosing it will do */
  b.setAttribute("aria-pressed", String(musicOn));
  if (!ac) return;   /* sound is not unlocked yet; unlockAudio() calls back here */
  const now = ac.currentTime;
  bus.gain.cancelScheduledValues(now); bus.gain.setValueAtTime(bus.gain.value, now); bus.gain.setTargetAtTime(musicOn ? 0.6 : 0, now, musicOn ? 0.4 : 0.12);
  clearInterval(musicTimer); musicTimer = null;
  if (musicOn) { stepNo = 0; nextNote = 0; musicTimer = setInterval(schedule, 100); schedule(); }
}
function unlockAudio(e) {   /* must run inside a tap, click or key press */
  if (!AudioEngine || (!ac && !musicOn)) return;
  try {
    if (!ac) {
      /* "ambient" tells phones this is background sound: it plays alongside a visitor's own music
         instead of stopping it, and stays quiet when the phone's ring switch is on silent */
      if (navigator.audioSession) { try { navigator.audioSession.type = "ambient"; } catch (err) {} }
      ac = new AudioEngine(); unlockedBy = (e && e.type) || "button";
      const soften = ac.createBiquadFilter(); soften.type = "lowpass"; soften.frequency.value = 2400;
      bus = ac.createGain(); bus.gain.value = 0; bus.connect(soften); soften.connect(ac.destination);
      const wake = ac.createBufferSource(); wake.buffer = ac.createBuffer(1, 1, 22050); wake.connect(ac.destination); wake.start(0);   /* a silent sample: wakes audio on iPhones */
      syncMusic();
    }
    if (ac.state !== "running") { const r = ac.resume(); if (r && r.then) r.then(schedule, (err) => { audioError = "resume: " + err; }); }
  } catch (err) { audioError = String(err); }
}
["click", "touchend", "pointerup", "mousedown", "keydown"].forEach((type) => document.addEventListener(type, unlockAudio, { capture: true, passive: true }));
document.addEventListener("visibilitychange", schedule);
$("#m-music").addEventListener("click", () => {
  musicOn = !musicOn; store.set("music3", musicOn ? "1" : "0");
  syncMusic(); unlockAudio();
});

/* Add ?debug to the address (halflife.studio/?debug) to show a live readout of the sound system. */
if (/[?&]debug\b/.test(location.search)) {
  const box = el("pre"); box.style.cssText = "position:fixed;left:8px;top:8px;z-index:9;margin:0;padding:8px 10px;background:#000;color:#fff;border:2px solid #fff;font:12px/1.5 monospace;white-space:pre-wrap;max-width:calc(100vw - 16px);text-shadow:none;pointer-events:none";
  document.body.append(box);
  setInterval(() => {
    box.textContent = [
      "SOUND DEBUG",
      "saved choice: " + store.get("music3"),
      "music wanted: " + musicOn,
      "engine: " + (ac ? ac.state : "not created") + (unlockedBy ? " (created on " + unlockedBy + ")" : ""),
      "engine clock: " + (ac ? ac.currentTime.toFixed(2) : "-"),
      "steps played: " + stepNo,
      "volume: " + (bus ? bus.gain.value.toFixed(2) : "-"),
      "audio session: " + (navigator.audioSession ? navigator.audioSession.type : "n/a"),
      "error: " + (audioError || "none"),
      navigator.userAgent.replace(/^Mozilla\/5\.0 /, "")
    ].join("\n");
  }, 300);
}

/* ==========================================================================
   8. START
   ========================================================================== */
const tick = () => { $("#clock").textContent = new Date().toTimeString().slice(0, 8); };
tick(); setInterval(tick, 1000);
sizeSky();
if (!reduceMotion) (function loop() { if (!document.hidden) drawSky(1); requestAnimationFrame(loop); })();
syncMusic();
showFiles();
syncLayers();
(async function loadEntries() {   /* fetch the entry list; the title screen is up while this happens */
  try {
    const r = await fetch("posts.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("status " + r.status);
    const data = await r.json();
    ABOUT = data.about || "";
    BESTIARY = Array.isArray(data.bestiary) ? data.bestiary : [];
    sorted = (data.posts || []).filter((p) => p && p.file).sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.file.localeCompare(a.file));
    loadNote = "No entries yet.";
  } catch (e) { loadNote = "Could not load the log. Refresh to try again."; }
  $("#count").textContent = sorted.length;
  $("#latest").textContent = sorted[0] ? day(sorted[0].date).split(",")[0] || "-" : "-";
  const linkId = decodeURIComponent((location.hash || "").slice(1));
  pendingPost = sorted.find((p) => p.file === linkId) || null;
  if (view === "files" && reader.hidden) showFiles(introBox.classList.contains("done"));
  if (view === "bestiary") showBestiary();
  if (pendingPost && introBox.classList.contains("done")) { showPost(pendingPost); pendingPost = null; }
})();
startSprite();
$("#startbtn").focus();
</script>
