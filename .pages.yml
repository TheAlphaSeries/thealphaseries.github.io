# Settings for the editor at app.pagescms.org.
# Entries are saved as files in posts/, photos in photos/.
media:
  input: photos
  output: /photos
  rename: safe
  categories: [image]
content:
  - name: posts
    label: Log entries
    type: collection
    path: posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: place
        label: Where (optional - type a map pin's name exactly, e.g. Pine Lake, and the two get linked)
        type: string
      - name: body
        label: Entry
        type: rich-text
        options:
          format: markdown
  - name: bestiary
    label: Bestiary
    type: collection
    path: bestiary
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: name
        label: Fish
        type: string
        required: true
      - name: sprite
        label: Picture (body shape)
        type: select
        options:
          values:
            - name: trout
              label: Trout
            - name: sunfish
              label: Sunfish
            - name: crappie
              label: Crappie
            - name: bass
              label: Bass
            - name: catfish
              label: Catfish
            - name: flatfish
              label: Flatfish (halibut, flounder, sanddab)
            - name: tuna
              label: Tuna shape (tuna, mackerel, bonito, yellowtail)
            - name: shark
              label: Shark
            - name: ray
              label: Ray
            - name: sturgeon
              label: Sturgeon
            - name: crab
              label: Crab
            - name: lobster
              label: Lobster or crayfish
            - name: squid
              label: Squid
            - name: fish
              label: Other fish
      - name: date
        label: Date caught
        type: date
        options:
          format: yyyy-MM-dd
      - name: weight
        label: Weight in pounds (decimals are fine, e.g. 1.25)
        type: string
      - name: length
        label: Length in inches (decimals are fine, e.g. 13.5)
        type: string
      - name: location
        label: Where
        type: string
      - name: rarity
        label: Rarity
        type: select
        options:
          values:
            - name: common
              label: Common
            - name: uncommon
              label: Uncommon
            - name: rare
              label: Rare
            - name: epic
              label: Epic
            - name: legendary
              label: Legendary
      - name: catch_rate
        label: Catch rate, as a percent from 1 to 100 (e.g. 12)
        type: string
      - name: fight
        label: Fight (how hard it fought)
        type: select
        options:
          values:
            - name: "1"
              label: 1 - Came quietly
            - name: "2"
              label: 2 - Some protest
            - name: "3"
              label: 3 - A proper tussle
            - name: "4"
              label: 4 - Fierce
            - name: "5"
              label: 5 - A battle
      - name: lure
        label: Caught on (bait or lure)
        type: string
      - name: photo
        label: Photo of the fish
        type: image
      - name: status
        label: Caught yet?
        type: select
        options:
          values:
            - name: caught
              label: Caught
            - name: wanted
              label: Not yet - show it as a mystery fish
      - name: body
        label: Lore
        type: rich-text
        options:
          format: markdown
  - name: albums
    label: Photo albums
    type: collection
    path: albums
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Album name
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: place
        label: Where (optional - type a map pin's name exactly, e.g. Pine Lake, and the two get linked)
        type: string
      - name: photos
        label: Photos (pick as many as you like; the first one is the cover)
        type: image
        options:
          multiple:
            max: 300
      - name: body
        label: A few words about it (optional)
        type: rich-text
        options:
          format: markdown
  - name: places
    label: Map pins
    type: collection
    path: places
    format: yaml-frontmatter
    filename: "{primary}.md"
    fields:
      - name: name
        label: Name of the place
        type: string
        required: true
      - name: kind
        label: Kind of pin
        type: select
        options:
          values:
            - name: fishing
              label: Fishing spot
            - name: landmark
              label: Landmark
            - name: hike
              label: Hike
            - name: trip
              label: Trip
      - name: coordinates
        label: Coordinates (in Google Maps, right-click the spot, click the numbers to copy, paste here - e.g. 37.7297, -122.1040)
        type: string
        required: true
      - name: date
        label: Date (optional)
        type: date
        options:
          format: yyyy-MM-dd
      - name: trip
        label: Trip name (optional - pins that share the exact same trip name are joined by a route, e.g. China and Hong Kong)
        type: string
      - name: stop
        label: Stop number on that trip (1, 2, 3 ...)
        type: string
      - name: photo
        label: Photo (optional)
        type: image
      - name: body
        label: Note (optional)
        type: rich-text
        options:
          format: markdown
  - name: bestiary_intro
    label: Bestiary intro
    type: file
    path: pages/bestiary.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: Short blurb shown at the top of the Bestiary
        type: rich-text
        options:
          format: markdown
  - name: about
    label: About page
    type: file
    path: pages/about.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: About text
        type: rich-text
        options:
          format: markdown
