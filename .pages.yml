# Settings for the editor at app.pagescms.org.
# Posts are saved as files in posts/, albums in albums/, photos in photos/.
media:
  input: photos
  output: /photos
  rename: safe
  categories: [image]
content:
  - name: posts
    label: Journal
    type: collection
    path: posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: kind
        label: Kind (leave blank for an ordinary journal entry; Plants and Fishing get their own ring colour and their own list)
        type: select
        options:
          placeholder: Journal
          values:
            - name: plants
              label: Plants (house plants and bonsai)
            - name: fishing
              label: Fishing (fishing tales)
      - name: cover
        label: Note photo (optional - shown beside the entry when it is opened, like the object in a game's lore note; otherwise the first photo in the post is used, and with no photo at all the entry gets its own storage-media relic)
        type: image
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown
  - name: albums
    label: Photo albums
    type: collection
    path: albums
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Album name
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: photos
        label: Photos (pick as many as you like; the first one is the cover)
        type: image
        options:
          multiple:
            max: 300
      - name: captions
        label: Captions (optional - add one for each photo you want to caption)
        type: object
        list: true
        fields:
          - name: photo
            label: Which photo
            type: image
          - name: caption
            label: Caption
            type: string
      - name: body
        label: A few words about it (optional)
        type: rich-text
        options:
          format: markdown
  - name: about
    label: About page
    type: file
    path: pages/about.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: About text
        type: rich-text
        options:
          format: markdown
