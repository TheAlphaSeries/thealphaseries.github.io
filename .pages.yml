# Settings for the editor at app.pagescms.org.
# Entries are saved as files in posts/, photos in photos/.
media:
  input: photos
  output: /photos
  rename: safe
  categories: [image]
content:
  - name: posts
    label: Log entries
    type: collection
    path: posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: body
        label: Entry
        type: rich-text
        options:
          format: markdown
  - name: bestiary
    label: Bestiary
    type: collection
    path: bestiary
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: name
        label: Fish
        type: string
        required: true
      - name: sprite
        label: Species
        type: select
        options:
          values:
            - name: trout
              label: Trout
            - name: sunfish
              label: Sunfish
            - name: crappie
              label: Crappie
            - name: bass
              label: Bass
            - name: catfish
              label: Catfish
            - name: fish
              label: Other fish
      - name: date
        label: Date caught
        type: date
        options:
          format: yyyy-MM-dd
      - name: weight
        label: Weight in pounds (decimals are fine, e.g. 1.25)
        type: string
      - name: length
        label: Length in inches (decimals are fine, e.g. 13.5)
        type: string
      - name: location
        label: Where
        type: string
      - name: photo
        label: Photo of the fish
        type: image
      - name: body
        label: Lore
        type: rich-text
        options:
          format: markdown
  - name: about
    label: About page
    type: file
    path: pages/about.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: About text
        type: rich-text
        options:
          format: markdown
